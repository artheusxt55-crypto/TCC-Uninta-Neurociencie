<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTBOT NEURAL - UNINTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-player/2.0.4/lottie-player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client; 
    </script>

    <style>
        :root { 
            --primary: #e30613; 
            --bg: #000;
            --neural-red: 0 85% 55%;
        }
        * { font-family: 'IBM Plex Mono', monospace; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        .scanline::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.2;
        }

        .glass-card { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(227, 6, 19, 0.2); border-radius: 12px; }
        .msg-row { display: flex; width: 100%; gap: 12px; align-items: flex-start; margin-bottom: 1.5rem; animation: fadeIn 0.4s ease-out forwards; position: relative; z-index: 30; }
        .msg-row.user { flex-direction: row-reverse; }
        .bubble { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 13px; line-height: 1.6; }
        .bot-bubble { background: rgba(22, 22, 22, 0.9); border-left: 3px solid var(--primary); color: #efefef; }
        .user-bubble { background: rgba(227, 6, 19, 0.05); border-right: 3px solid #444; color: #d1d5db; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Orbe e Microfone - Mantendo o centro livre */
        #lovable-ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .mic-trigger { pointer-events: auto; cursor: pointer; position: relative; z-index: 50; transition: all 0.3s ease; }
    </style>
</head>
<body class="scanline">

    <div id="lovable-ui"></div>

    <header class="h-16 border-b border-red-900/40 bg-black flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_#e30613]"></div>
            <span class="text-xs font-bold tracking-[0.3em] uppercase">UNINTA <span class="text-red-600">UNTBOT_V5</span></span>
        </div>
        <div class="flex items-center gap-3 bg-red-950/20 px-3 py-1.5 rounded-full border border-red-900/50">
            <span id="user-tag" class="text-[10px] text-red-400 font-bold uppercase">AGUARDANDO_ID</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <main class="flex-1 flex flex-col p-4 md:p-6 gap-4 relative overflow-hidden z-20">
            <div id="chat-display" class="flex-1 glass-card p-6 overflow-y-auto no-scrollbar space-y-4"></div>

            <div class="h-20 glass-card flex items-center px-6 gap-4 border-red-600/20 relative z-50">
                <input type="text" id="userInput" class="flex-1 bg-transparent border-none outline-none text-red-100 text-sm" placeholder="Fale ou digite o comando..." autocomplete="off">
                <button id="btnEnviar" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded text-[10px] font-bold tracking-widest uppercase shadow-lg transition-all active:scale-95">Scanner⚡</button>
                <div id="loading-bar" class="absolute bottom-0 left-0 h-[2px] bg-red-600 w-0 transition-all duration-700"></div>
            </div>
        </main>
    </div>

    <script type="text/babel">
        const motion = window.Motion.motion;
        const { useState, useEffect } = React;

        function NeuralVoiceInterface() {
            const [volume, setVolume] = useState(0);
            const [isListening, setIsListening] = useState(false);

            useEffect(() => {
                const updateVolume = () => {
                    if (window.isBotSpeaking) {
                        setVolume(0.5 + Math.random() * 0.5);
                    } else if (isListening) {
                        setVolume(0.3 + Math.random() * 0.2);
                    } else {
                        setVolume(0);
                    }
                    requestAnimationFrame(updateVolume);
                };
                updateVolume();
            }, [isListening]);

            const startListening = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Navegador incompatível com voz.");
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';
                recognition.onstart = () => setIsListening(true);
                recognition.onend = () => setIsListening(false);
                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    document.getElementById('userInput').value = text;
                    window.forceSend();
                };
                recognition.start();
            };

            return (
                <div className="relative flex items-center justify-center">
                    <motion.div 
                        className="absolute w-72 h-72 rounded-full"
                        animate={{ scale: [1, 1.1, 1], opacity: [0.1, 0.2, 0.1] }}
                        transition={{ duration: 4, repeat: Infinity }}
                        style={{
                            background: `radial-gradient(circle, #e30613 0%, transparent 70%)`,
                            filter: 'blur(60px)',
                        }}
                    />

                    <motion.div 
                        className="absolute w-44 h-44 rounded-full"
                        style={{
                            background: `#e30613`,
                            filter: `blur(${30 + volume * 40}px)`,
                            opacity: 0.2 + volume * 0.5
                        }}
                        animate={{ scale: isListening || window.isBotSpeaking ? 1.2 : 1 }}
                    />
                    
                    <div className="mic-trigger" onClick={startListening}>
                        <motion.div 
                            className="w-24 h-24 rounded-full border border-red-500/40 flex items-center justify-center backdrop-blur-2xl bg-black/50 shadow-[0_0_30px_rgba(227,6,19,0.3)]"
                            whileHover={{ scale: 1.1 }}
                            whileTap={{ scale: 0.9 }}
                        >
                            <span className="text-white text-3xl drop-shadow-md">
                                {isListening ? "●" : "🎤"}
                            </span>
                        </motion.div>
                        
                        <motion.div 
                            className="absolute -inset-3 border border-red-600/20 rounded-full border-t-red-600/60"
                            animate={{ rotate: 360 }}
                            transition={{ duration: 4, repeat: Infinity, ease: "linear" }}
                        />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("lovable-ui"));
        root.render(<NeuralVoiceInterface />);
    </script>

    <script type="module">
        const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
        const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";

        const input = document.getElementById('userInput');
        const display = document.getElementById('chat-display');
        const userTag = document.getElementById('user-tag');
        const bar = document.getElementById('loading-bar');
        
        let currentUserId = localStorage.getItem('untbot_last_id');
        let DIRETRIZES_MESTRE = "";
        window.isBotSpeaking = false; 

        async function salvarNoRedis(usuario, msg) { await fetch(`${REDIS_URL}/lpush/${usuario}/${encodeURIComponent(msg)}?_token=${REDIS_TOKEN}`); }
        async function buscarDoRedis(usuario) { try { const res = await fetch(`${REDIS_URL}/lrange/${usuario}/0/5?_token=${REDIS_TOKEN}`); const data = await res.json(); return data.result || []; } catch(e) { return []; } }
        
        function addMessageToUI(role, text) {
            const isBot = role === 'bot';
            const row = document.createElement('div'); row.className = `msg-row ${isBot ? 'bot' : 'user'}`;
            const bubble = document.createElement('div'); bubble.className = `bubble ${isBot ? 'bot-bubble' : 'user-bubble'}`;
            bubble.innerText = text;
            row.innerHTML = `<div class="w-10 h-10 rounded-full border border-red-900 flex items-center justify-center bg-black text-xs">${isBot ? '🤖' : '👤'}</div>`;
            row.appendChild(bubble);
            display.appendChild(row); display.scrollTop = display.scrollHeight;
            return bubble;
        }

        async function enviar() {
            const txt = input.value.trim();
            if(!txt) return;

            if(!currentUserId) {
                currentUserId = txt.toLowerCase(); localStorage.setItem('untbot_last_id', currentUserId);
                userTag.innerText = currentUserId.toUpperCase();
                addMessageToUI('bot', `>> SISTEMA RECONHECIDO: ${currentUserId.toUpperCase()}.`);
                input.value = ""; return;
            }

            addMessageToUI('user', txt);
            bar.style.width = "85%"; input.value = ""; input.disabled = true;

            try {
                const historico = await buscarDoRedis(currentUserId);
                const contextoPersonalidadeFinal = `${DIRETRIZES_MESTRE} | Data: ${new Date().toLocaleString()} | Histórico: ${historico.join(' | ')}`;

                const res = await fetch("/api/analisar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: txt, systemContext: contextoPersonalidadeFinal })
                });
                
                const data = await res.json();
                const resp = data.choices[0].message.content;

                addMessageToUI('bot', resp);
                await salvarNoRedis(currentUserId, `U: ${txt} | B: ${resp}`);

                const vClient = await window.GradioClient.connect("Ttheus/uninta-voice");
                const vRes = await vClient.predict("/sintetizar", { text: resp });
                
                if (vRes.data && vRes.data[0]) {
                    const audio = new Audio(vRes.data[0].url);
                    audio.onplay = () => { window.isBotSpeaking = true; };
                    audio.onended = () => { window.isBotSpeaking = false; };
                    audio.play();
                }
            } catch (e) { 
                addMessageToUI('bot', ">> FALHA NA REDE NEURAL."); 
                window.isBotSpeaking = false;
            } finally { 
                bar.style.width = "0%"; input.disabled = false;
            }
        }

        window.forceSend = enviar;
        document.getElementById('btnEnviar').onclick = enviar;
        input.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };

        window.onload = async () => {
            if(currentUserId) userTag.innerText = currentUserId.toUpperCase();
            try {
                const res = await fetch(`${REDIS_URL}/get/DIRETRIZES_MESTRE?_token=${REDIS_TOKEN}`);
                const data = await res.json();
                DIRETRIZES_MESTRE = data.result || "";
            } catch(e) {}
        };
    </script>
</body>
</html>
