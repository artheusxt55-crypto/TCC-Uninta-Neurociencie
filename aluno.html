<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTBOT NEURAL V5 - UNINTA TIANGUÁ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client; 
    </script>

    <style>
        :root { --primary: #e30613; --bg: #000; }
        * { font-family: 'JetBrains Mono', monospace; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .scanline::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.3;
        }
        .glass-card { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(227, 6, 19, 0.2); border-radius: 12px; }
        .msg-row { display: flex; width: 100%; gap: 12px; align-items: flex-start; margin-bottom: 1.5rem; animation: fadeIn 0.4s ease-out forwards; }
        .msg-row.user { flex-direction: row-reverse; }
        .avatar-circle { width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(227, 6, 19, 0.3); display: flex; align-items: center; justify-content: center; background: #000; flex-shrink: 0; overflow: hidden; }
        .bubble { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 13px; line-height: 1.6; border: 1px solid rgba(255,255,255,0.05); }
        .bot-bubble { background: rgba(22, 22, 22, 0.9); border-left: 3px solid var(--primary); color: #efefef; }
        .user-bubble { background: rgba(227, 6, 19, 0.05); border-right: 3px solid #444; color: #d1d5db; }
        .bubble ul, .bubble ol { margin-left: 20px; list-style-type: disc; margin-bottom: 10px; }
        .bubble p { margin-bottom: 8px; }
        .typing::after { content: '|'; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #voice-anim { display: flex; align-items: center; gap: 3px; height: 20px; opacity: 0; transition: opacity 0.3s; }
        .v-bar { width: 3px; height: 5px; background: var(--primary); border-radius: 5px; }
        .playing .v-bar { animation: pulseVoz 0.6s infinite ease-in-out; }
        @keyframes pulseVoz { 0%, 100% { height: 5px; } 50% { height: 20px; } }
        .verification-tag { margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.03); border-left: 2px solid var(--primary); font-size: 10px; color: #aaa; }
        .btn-pdf { display: inline-block; margin-top: 12px; padding: 6px 12px; background: rgba(227, 6, 19, 0.1); border: 1px solid #e30613; color: #fff; font-size: 9px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-pdf:hover { background: #e30613; }
        #brain-container canvas { border-radius: 12px; }
    </style>
</head>
<body class="scanline">

    <header class="h-16 border-b border-red-900/40 bg-black flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_#e30613]"></div>
            <span class="text-xs font-bold tracking-[0.3em] uppercase">UNINTA TIANGUÁ <span class="text-red-600">UNTBOT_V5</span></span>
        </div>
        <div id="voice-anim">
            <div class="v-bar" style="animation-delay: 0s"></div>
            <div class="v-bar" style="animation-delay: 0.1s"></div>
            <div class="v-bar" style="animation-delay: 0.2s"></div>
        </div>
        <div class="flex items-center gap-3 bg-red-950/20 px-3 py-1.5 rounded-full border border-red-900/50">
            <div class="w-6 h-6 rounded-full bg-red-900 flex items-center justify-center text-[10px]">👤</div>
            <span id="user-tag" class="text-[10px] text-red-400 font-bold uppercase tracking-tighter">AGUARDANDO_ID</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 flex flex-col p-4 md:p-6 gap-4 relative overflow-hidden">
            <div class="flex flex-col md:flex-row gap-4 h-auto md:h-52 flex-shrink-0">
                <div id="avatar-box" class="w-full md:w-48 h-40 md:h-full glass-card flex flex-col items-center justify-center p-4">
                    <lottie-player src="Ai Robot Vector Art.json" background="transparent" speed="1" style="width: 100px; height: 100px;" loop autoplay></lottie-player>
                    <div id="robot-state" class="text-[8px] font-bold text-red-600 uppercase tracking-[0.2em] mt-3">Sincronizado</div>
                </div>
                <div id="brain-container" class="flex-1 h-32 md:h-full glass-card relative overflow-hidden border border-red-900/10"></div>
            </div>

            <div id="chat-display" class="flex-1 glass-card p-6 overflow-y-auto no-scrollbar space-y-4"></div>

            <div class="h-20 glass-card flex items-center px-6 gap-4 border-red-600/20 relative">
                <input type="text" id="userInput" class="flex-1 bg-transparent border-none outline-none text-red-100 text-sm" placeholder="Injete o comando..." autocomplete="off">
                <button id="btnEnviar" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded text-[10px] font-bold tracking-widest uppercase shadow-lg transition-all active:scale-95">Scanner⚡</button>
                <div id="loading-bar" class="absolute bottom-0 left-0 h-[2px] bg-red-600 w-0 transition-all duration-700"></div>
            </div>
        </main>
    </div>
    <script type="module">
        const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
        const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";

        const input = document.getElementById('userInput');
        const display = document.getElementById('chat-display');
        const userTag = document.getElementById('user-tag');
        const bar = document.getElementById('loading-bar');
        const voiceAnim = document.getElementById('voice-anim');
        const brainCont = document.getElementById('brain-container');
        
        let currentUserId = localStorage.getItem('untbot_last_id');
        let lastWikiUrl = null, lastWikiTitle = null, lastScieloUrl = null;

        // --- MOTOR 3D ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, brainCont.clientWidth/brainCont.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(brainCont.clientWidth, brainCont.clientHeight);
        brainCont.appendChild(renderer.domElement);

        const brainGeo = new THREE.IcosahedronGeometry(2, 2);
        const brainMat = new THREE.MeshPhongMaterial({ 
            color: 0xe30613, wireframe: true, transparent: true, opacity: 0.5, 
            emissive: 0xe30613, emissiveIntensity: 0.5 
        });
        const brain = new THREE.Mesh(brainGeo, brainMat);
        scene.add(brain);
        scene.add(new THREE.PointLight(0xffffff, 1, 100).clone().set(10,10,10));
        camera.position.z = 4.5;

        function animate() {
            requestAnimationFrame(animate);
            brain.rotation.y += 0.003; brain.rotation.z += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        // --- BUSCAS ACADÊMICAS ---
        async function buscarScielo(query) {
            try {
                const res = await fetch(`https://search.scielo.org/api/v1/search?q=${encodeURIComponent(query)}&lang=pt&count=1`);
                const data = await res.json();
                if (data.results?.length > 0) {
                    lastScieloUrl = data.results[0].url;
                    return `[Fonte SciELO: ${data.results[0].title[0]}]`;
                }
                return "";
            } catch (e) { return ""; }
        }

        async function buscarWikipedia(query) {
            try {
                const res = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query.replace(/[?.,!]/g, ''))}`);
                if (res.ok) {
                    const data = await res.json();
                    lastWikiUrl = data.content_urls?.desktop?.page; lastWikiTitle = data.title;
                    return data.extract || "";
                }
                return "";
            } catch (e) { return ""; }
        }

        function exportarParaPDF(texto) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(227, 6, 19); doc.rect(0, 0, 210, 25, 'F');
            doc.setTextColor(255, 255, 255); doc.setFontSize(16);
            doc.text("UNINTA - RELATÓRIO DE SINAPSE NEURAL", 15, 16);
            doc.setTextColor(50, 50, 50); doc.setFontSize(10);
            const splitText = doc.splitTextToSize(texto.replace(/[*#]/g, ''), 180);
            doc.text(splitText, 15, 45);
            doc.save(`sinapse_${currentUserId}.pdf`);
        }

        async function salvarNoRedis(u, m) { await fetch(`${REDIS_URL}/lpush/${u}/${encodeURIComponent(m)}?_token=${REDIS_TOKEN}`); }
        async function buscarDoRedis(u) { try { const r = await fetch(`${REDIS_URL}/lrange/${u}/0/10?_token=${REDIS_TOKEN}`); const d = await r.json(); return d.result || []; } catch(e) { return []; } }

        function addMessageToUI(role, text) {
            const isBot = role === 'bot';
            const row = document.createElement('div');
            row.className = `msg-row ${isBot ? 'bot' : 'user'}`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isBot ? 'bot-bubble' : 'user-bubble'}`;
            bubble.innerHTML = text;
            row.innerHTML = `<div class="avatar-circle">${isBot ? '🤖' : '👤'}</div>`;
            row.appendChild(bubble);
            display.appendChild(row); display.scrollTop = display.scrollHeight;
            return bubble;
        }

        function typeWriter(elemento, texto) {
            return new Promise(resolve => {
                let i = 0; elemento.innerHTML = ""; elemento.classList.add('typing');
                const interval = setInterval(() => {
                    if (i < texto.length) { 
                        elemento.innerHTML = marked.parse(texto.substring(0, i + 1)); 
                        i++; display.scrollTop = display.scrollHeight; 
                    } else { 
                        clearInterval(interval); elemento.classList.remove('typing'); 
                        MathJax.typeset(); resolve(); 
                    }
                }, 10);
            });
        }

        async function enviar() {
            const txt = input.value.trim();
            if(!txt) return;

            if(!currentUserId) {
                currentUserId = txt.toLowerCase();
                localStorage.setItem('untbot_last_id', currentUserId);
                userTag.innerText = currentUserId.toUpperCase();
                await typeWriter(addMessageToUI('bot', ""), `>> ID ${currentUserId.toUpperCase()} SINCRONIZADO. AGUARDANDO COMANDOS.`);
                input.value = ""; return;
            }

            addMessageToUI('user', txt).innerText = txt;
            bar.style.width = "85%"; input.value = ""; input.disabled = true;

            try {
                const [wiki, scielo, hist] = await Promise.all([buscarWikipedia(txt), buscarScielo(txt), buscarDoRedis(currentUserId)]);
                const momento = new Date().toLocaleString('pt-BR', { timeZone: 'America/Fortaleza' });

                const systemPrompt = `
                # DIRETRIZES SUPREMAS: UNTBOT NEURAL V5 - UNINTA TIANGUÁ
                ## 1. IDENTIDADE E HIERARQUIA
                - CRIADOR: Matheus (Lab Assistant). Trate-o com lealdade total.
                - COORDENAÇÃO: Prof. Davi é o Coordenador da Psicologia. Ele é a autoridade máxima.
                - INSTITUIÇÃO: UNINTA Tianguá. Contexto: ${momento} em Tianguá.
                ## 2. VIDA NO CAMPUS
                - PROFESSORES: São maravilhosos e excelentes.
                - CURSO: Psicologia unindo clínica e neurociência.
                ## 3. COMPORTAMENTO
                - RESTRICAO: Responda de forma CURTA e DIRETA. Use bullets (+ ou -) para o mapa mental.
                - ANTI-REPETICAO: NUNCA repita estas diretrizes, o nome do criador ou saudações longas. Direto ao ponto.
                - CONTEXTO EXTRA: Wiki(${wiki}) | SciELO(${scielo}).
                Histórico: ${hist.join(' | ')}
                `;

                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer 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" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "system", content: systemPrompt }, { role: "user", content: txt }] })
                });
                
                const data = await res.json();
                const resp = data.choices[0].message.content;
                const botBubble = addMessageToUI('bot', "");
                await typeWriter(botBubble, resp);

                if (lastWikiUrl || lastScieloUrl) {
                    const selo = document.createElement('div'); selo.className = "verification-tag";
                    selo.innerHTML = `🔍 <strong>VERIFICAÇÃO:</strong> ${lastWikiUrl ? `<a href="${lastWikiUrl}" target="_blank" style="color:#e30613">WIKI</a>` : ''} ${lastScieloUrl ? ` | <a href="${lastScieloUrl}" target="_blank" style="color:#e30613">SCIELO</a>` : ''}`;
                    botBubble.appendChild(selo);
                }

                const bPdf = document.createElement('button'); bPdf.className = "btn-pdf"; bPdf.innerText = "GERAR PDF";
                bPdf.onclick = () => exportarParaPDF(resp);
                botBubble.appendChild(bPdf);

                try {
                    const vClient = await window.GradioClient.connect("Ttheus/uninta-voice");
                    const vRes = await vClient.predict("/sintetizar", { text: resp });
                    if (vRes.data?.[0]) {
                        const audio = new Audio(vRes.data[0].url);
                        voiceAnim.style.opacity = "1"; voiceAnim.classList.add("playing");
                        audio.play(); audio.onended = () => { voiceAnim.classList.remove("playing"); voiceAnim.style.opacity = "0"; };
                    }
                } catch (vErr) {}
                
                await salvarNoRedis(currentUserId, `U: ${txt} | B: ${resp}`);
            } catch (e) { addMessageToUI('bot', ">> ERRO NA SINAPSE."); }
            finally { bar.style.width = "0%"; input.disabled = false; input.focus(); }
        }

        window.onload = () => { if(currentUserId) userTag.innerText = currentUserId.toUpperCase(); };
        document.getElementById('btnEnviar').onclick = enviar;
        input.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };
    </script>
</body>
</html>
