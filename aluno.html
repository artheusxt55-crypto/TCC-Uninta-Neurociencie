<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTBOT NEURAL - UNINTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e30613; --bg: #000; }
        * { font-family: 'JetBrains Mono', monospace; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        .scanline::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.3;
        }

        .glass-card { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(227, 6, 19, 0.2); border-radius: 12px; }
        .red-glow { filter: drop-shadow(0 0 15px rgba(227, 6, 19, 0.5)); }
        
        .msg-row { display: flex; width: 100%; gap: 12px; align-items: flex-start; margin-bottom: 1.5rem; animation: fadeIn 0.4s ease-out forwards; }
        .msg-row.user { flex-direction: row-reverse; }
        
        .avatar-circle { 
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(227, 6, 19, 0.3);
            display: flex; align-items: center; justify-content: center; background: #000; flex-shrink: 0; overflow: hidden;
        }
        
        .bubble { 
            max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 13px; line-height: 1.6;
            position: relative; border: 1px solid rgba(255,255,255,0.05);
        }
        
        .bot-bubble { background: rgba(22, 22, 22, 0.9); border-left: 3px solid var(--primary); color: #efefef; }
        .user-bubble { background: rgba(227, 6, 19, 0.05); border-right: 3px solid #444; color: #d1d5db; }

        .typing::after { content: '|'; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        canvas { width: 100% !important; height: 100% !important; border-radius: 12px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="scanline">

    <header class="h-16 border-b border-red-900/40 bg-black flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_#e30613]"></div>
            <span class="text-xs font-bold tracking-[0.3em] uppercase">UNINTA <span class="text-red-600">UNTBOT_V3</span></span>
        </div>
        <div class="flex items-center gap-3 bg-red-950/20 px-3 py-1.5 rounded-full border border-red-900/50">
            <div class="w-6 h-6 rounded-full bg-red-900 flex items-center justify-center text-[10px]">👤</div>
            <span id="user-tag" class="text-[10px] text-red-400 font-bold uppercase tracking-tighter">Identificando...</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="hidden lg:flex w-60 flex-col border-r border-red-900/10 bg-black p-5">
            <span class="text-[10px] text-red-700 font-bold mb-6 tracking-widest uppercase">Console_Output</span>
            <div id="logs-container" class="space-y-3 text-[9px] text-red-500/30 overflow-y-auto no-scrollbar font-mono">
                <div>> NEURAL_CORE_INITIALIZED</div>
                <div>> LOTTIE_ANIMATION_LOADED</div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col p-4 md:p-6 gap-4 relative overflow-hidden">
            <div class="flex flex-col md:flex-row gap-4 h-auto md:h-52 flex-shrink-0">
                <div id="avatar-box" class="w-full md:w-48 h-40 md:h-full glass-card flex flex-col items-center justify-center p-4">
                    <lottie-player src="Ai Robot Vector Art.json" background="transparent" speed="1" style="width: 100px; height: 100px;" loop autoplay></lottie-player>
                    <div id="robot-state" class="text-[8px] font-bold text-red-600 uppercase tracking-[0.2em] mt-3">Sincronizado</div>
                </div>
                <div id="brain-container" class="flex-1 h-32 md:h-full glass-card relative overflow-hidden border border-red-900/10">
                    <div class="absolute top-2 left-4 text-[8px] text-red-500/40 z-10 font-bold tracking-[0.2em]">3D_NEURAL_MAP</div>
                </div>
            </div>

            <div id="chat-display" class="flex-1 glass-card p-6 overflow-y-auto no-scrollbar space-y-4">
                </div>

            <div class="h-20 glass-card flex items-center px-6 gap-4 border-red-600/20 relative">
                <input type="text" id="userInput" class="flex-1 bg-transparent border-none outline-none text-red-100 text-sm" placeholder="Injete o comando neural..." autocomplete="off">
                <button id="btnEnviar" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded text-[10px] font-bold tracking-widest uppercase shadow-lg transition-all active:scale-95">Scanner⚡</button>
                <div id="loading-bar" class="absolute bottom-0 left-0 h-[2px] bg-red-600 w-0 transition-all duration-700 shadow-[0_0_10px_#e30613]"></div>
            </div>
        </main>
    </div>

    <script type="module">
        // --- 1. CÉREBRO 3D ---
        const container = document.getElementById('brain-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.IcosahedronGeometry(2, 2);
        const material = new THREE.MeshPhongMaterial({
            color: 0xe30613, wireframe: true, transparent: true, opacity: 0.5, emissive: 0xe30613, emissiveIntensity: 0.4
        });
        const brain = new THREE.Mesh(geometry, material);
        scene.add(brain);

        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        camera.position.z = 4.5;

        function animate() {
            requestAnimationFrame(animate);
            brain.rotation.y += 0.003;
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. LÓGICA DO BOT ---
        const input = document.getElementById('userInput');
        const display = document.getElementById('chat-display');
        const logs = document.getElementById('logs-container');
        const bar = document.getElementById('loading-bar');
        const userTag = document.getElementById('user-tag');

        let currentUserId = localStorage.getItem('untbot_last_id');
        if(currentUserId) userTag.innerText = currentUserId.toUpperCase();

        function addMessageToUI(role, text) {
            const isBot = role === 'bot';
            const row = document.createElement('div');
            row.className = `msg-row ${isBot ? 'bot' : 'user'}`;
            
            const avatar = document.createElement('div');
            avatar.className = "avatar-circle";
            
            // AQUI ESTÁ A MÁGICA: O SEU ARQUIVO JSON NO LUGAR DO EMOJI
            avatar.innerHTML = isBot 
                ? `<lottie-player src="Ai Robot Vector Art.json" background="transparent" speed="1" style="width: 50px; height: 50px;" loop autoplay></lottie-player>` 
                : `<span style="font-size: 20px;">👤</span>`;
            
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isBot ? 'bot-bubble' : 'user-bubble'}`;
            
            row.appendChild(avatar);
            row.appendChild(bubble);
            display.appendChild(row);
            display.scrollTop = display.scrollHeight;
            
            return bubble;
        }

        // Mensagem de boas-vindas
        window.onload = () => {
            const welcome = addMessageToUI('bot', "");
            typeWriter(welcome, ">> [SISTEMA]: NÚCLEO ATIVO. DIGA SEU NOME PARA ACESSAR OS DADOS DO LAB, MACHO.");
        };

        async function falar(texto) {
            const limpo = texto.replace(/[*#]/g, '');
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(limpo)}&tl=pt-BR&client=tw-ob`;
            const audio = new Audio(url);
            audio.playbackRate = 1.1;
            return audio.play();
        }

        function typeWriter(elemento, texto) {
            return new Promise(resolve => {
                let i = 0;
                elemento.classList.add('typing');
                const interval = setInterval(() => {
                    if (i < texto.length) {
                        elemento.innerHTML += texto.charAt(i);
                        i++;
                        display.scrollTop = display.scrollHeight;
                    } else {
                        clearInterval(interval);
                        elemento.classList.remove('typing');
                        resolve();
                    }
                }, 20);
            });
        }

        async function enviar() {
            const txt = input.value.trim();
            if(!txt) return;

            if(!currentUserId) {
                currentUserId = txt;
                localStorage.setItem('untbot_last_id', currentUserId);
                userTag.innerText = currentUserId.toUpperCase();
                const b = addMessageToUI('bot', "");
                typeWriter(b, `>> ID ${currentUserId} RECONHECIDO. O QUE VAMOS ANALISAR HOJE?`);
                input.value = "";
                return;
            }

            addMessageToUI('user', txt);
            bar.style.width = "85%";
            input.value = "";
            input.disabled = true;

            try {
                const res = await fetch("/api/analisar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        prompt: txt, 
                        systemContext: "Você é o UNTBOT PhD da UNINTA Tianguá. Fale como cearense. Nunca cite USP ou UFRGS." 
                    })
                });
                
                const data = await res.json();
                const resp = data.choices[0].message.content;

                const botBubble = addMessageToUI('bot', "");
                falar(resp);
                await typeWriter(botBubble, resp);

            } catch (e) {
                addMessageToUI('bot', ">> ERRO NA SINAPSE. TENTE NOVAMENTE.");
            } finally {
                bar.style.width = "0%";
                input.disabled = false;
                input.focus();
            }
        }

        document.getElementById('btnEnviar').onclick = enviar;
        input.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };
    </script>
</body>
</html>
