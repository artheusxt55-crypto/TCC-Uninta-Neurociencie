<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://*.upstash.io https://api.groq.com https://api.vocalremover.org https://* wss://*; media-src 'self' https://* data: blob:; img-src 'self' data: https://* blob:;">

    <title>UNTBOT NEURAL - UNINTA TIANGUÁ</title>
    
    <style>
        :root { --ia-cyan: #00f2ff; --primary-red: #e30613; --bg-dark: #010409; --panel-bg: rgba(13, 17, 23, 0.95); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg-dark); color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary-red); background: #000; z-index: 100; }
        
        #main-viewport { flex: 1; position: relative; display: flex; overflow: hidden; }
        
        #history-panel { width: 220px; border-right: 1px solid rgba(0, 242, 255, 0.1); background: rgba(0,0,0,0.8); padding: 20px; z-index: 10; overflow-y: auto; }
        .log-item { font-size: 10px; color: var(--ia-cyan); margin-bottom: 8px; padding: 5px; border-bottom: 1px solid #1a1a1a; text-transform: uppercase; }

        #robot-standby { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); z-index: 5; }
        #robot-vid { width: 150px; filter: drop-shadow(0 0 20px rgba(227, 6, 19, 0.4)); }

        #chat-display { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 850px; padding: 25px; background: var(--panel-bg); border-left: 4px solid var(--ia-cyan); color: #ddd; font-size: 14px; max-height: 200px; overflow-y: auto; z-index: 10; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }

        .control-panel { padding: 30px; background: #000; border-top: 1px solid #1a1a1a; z-index: 100; }
        .input-box { display: flex; gap: 15px; max-width: 1000px; margin: 0 auto; }
        input { flex: 1; padding: 18px; border-radius: 8px; border: 1px solid #333; background: #050505; color: var(--ia-cyan); outline: none; font-size: 16px; }
        .btn-analyze { height: 58px; border-radius: 8px; border: none; background: var(--primary-red); color: white; padding: 0 30px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        
        #loading-bar { height: 3px; background: var(--ia-cyan); width: 0%; position: absolute; bottom: 0; left: 0; transition: 0.4s; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 14px; font-weight: 900; letter-spacing: 4px;">UNINTA TIANGUÁ <span style="color:var(--ia-cyan)">UNTBOT_V3</span></div>
    <div id="user-tag" style="font-size: 10px; color: #666;">ID: AGUARDANDO...</div>
</header>

<div id="main-viewport">
    <aside id="history-panel">
        <div id="logs-container">
            <div class="log-item">> NUCLEO_ATIVO</div>
            <div class="log-item">> REDIS_SYNC_READY</div>
        </div>
    </aside>

    <div id="robot-standby">
        <video id="robot-vid" autoplay loop muted playsinline>
            <source src="robo-dormindo.mp4" type="video/mp4">
        </video>
    </div>

    <div id="chat-display">>> [SISTEMA]: IDENTIFIQUE-SE PARA INICIAR...<div id="loading-bar"></div></div>
</div>

<div class="control-panel">
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Digite seu nome ou ID..." autocomplete="off">
        <button id="btnEnviar" class="btn-analyze">SCANNER ⚡</button>
    </div>
</div>

<script type="module">
    // --- CONFIGURAÇÕES DO SEU REDIS (UPSTASH) ---
    const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
    // Removido o Bearer do token aqui para evitar duplicação no fetch
    const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";

    const input = document.getElementById('userInput');
    const display = document.getElementById('chat-display');
    const logsContainer = document.getElementById('logs-container');
    const bar = document.getElementById('loading-bar');
    const userTag = document.getElementById('user-tag');

    let currentUserId = localStorage.getItem('untbot_last_id');
    if(currentUserId) userTag.innerText = `ID: ${currentUserId.toUpperCase()}`;

    async function gerenciarMemoriaRedis(id, novaMsg = null) {
        // Limpa espaços no ID para não quebrar a URL
        const safeId = id.trim().replace(/\s+/g, '_').toLowerCase();
        const key = `untbot:memoria:${safeId}`;
        
        try {
            // BUSCA
            const res = await fetch(`${REDIS_URL}/get/${key}`, {
                headers: { "Authorization": `Bearer ${REDIS_TOKEN}` }
            });
            
            if (!res.ok) throw new Error("Falha na resposta do servidor");
            
            const data = await res.json();
            let historico = data.result ? JSON.parse(data.result) : [];

            if (novaMsg) {
                historico.push(novaMsg);
                if (historico.length > 10) historico.shift();
                
                // SALVA
                await fetch(`${REDIS_URL}/set/${key}`, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${REDIS_TOKEN}` },
                    body: JSON.stringify(JSON.stringify(historico))
                });
            }
            return historico.join("\n");
        } catch (e) {
            console.error("Erro Redis:", e);
            // Se o Redis falhar, retorna vazio para não travar a IA
            return "";
        }
    }

    async function falarUntbot(texto) {
        const limpo = texto.replace(/[*#]/g, '');
        const url = `https://api.vocalremover.org/api/v1/tts-generate?text=${encodeURIComponent(limpo)}&voice=antonio`;
        const audio = new Audio(url);
        return audio.play().catch(() => {
            const msg = new SpeechSynthesisUtterance(limpo);
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);
        });
    }

    function typeEffect(text) {
        return new Promise((resolve) => {
            let i = 0;
            display.innerHTML = ">> [UNTBOT]: ";
            const interval = setInterval(() => {
                if (i < text.length) {
                    display.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(interval);
                    resolve();
                }
            }, 20);
        });
    }

    async function enviar() {
        const txt = input.value.trim();
        if(!txt || window.isAnalyzing) return;

        if(!currentUserId) {
            currentUserId = txt;
            localStorage.setItem('untbot_last_id', currentUserId);
            userTag.innerText = `ID: ${currentUserId.toUpperCase()}`;
            display.innerHTML = `>> [SISTEMA]: ID ${currentUserId} RECONHECIDO. COMO POSSO AJUDAR, MACHO?`;
            input.value = "";
            return;
        }

        window.isAnalyzing = true;
        input.disabled = true;
        bar.style.width = "50%";

        try {
            const memoriaPrevia = await gerenciarMemoriaRedis(currentUserId);

            const systemContext = `
                Você é o UNTBOT, assistente neural da UNINTA Tianguá.
                IDENTIDADE: Criado por Matheus. Fale como um cearense (macho, fera, vixe).
                PROIBIÇÃO: Nunca cite USP ou UFRGS. 
                MEMÓRIA DO ALUNO: ${memoriaPrevia}
            `;

            const res = await fetch("/api/analisar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: txt, systemContext: systemContext })
            });

            const data = await res.json();
            const resp = data.choices[0].message.content;

            await gerenciarMemoriaRedis(currentUserId, `Usuário: ${txt} | Bot: ${resp}`);

            falarUntbot(resp);
            await typeEffect(resp);

            const log = document.createElement('div');
            log.className = 'log-item';
            log.innerText = `> MEM_SYNC_OK: ${currentUserId}`;
            logsContainer.prepend(log);

        } catch (e) {
            display.innerHTML = ">> [ERRO]: SINAPSE ROMPIDA. TENTE NOVAMENTE.";
        } finally {
            bar.style.width = "0%";
            window.isAnalyzing = false;
            input.disabled = false;
            input.value = "";
        }
    }

    document.getElementById('btnEnviar').onclick = enviar;
    input.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };
</script>
</body>
</html>
