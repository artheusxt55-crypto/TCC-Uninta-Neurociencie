<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTBOT NEURAL - UNINTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client; 
    </script>

    <style>
        :root { --primary: #e30613; --bg: #000; }
        * { font-family: 'JetBrains Mono', monospace; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .scanline::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.3;
        }
        .glass-card { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(227, 6, 19, 0.2); border-radius: 12px; }
        .msg-row { display: flex; width: 100%; gap: 12px; align-items: flex-start; margin-bottom: 1.5rem; animation: fadeIn 0.4s ease-out forwards; }
        .msg-row.user { flex-direction: row-reverse; }
        .avatar-circle { width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(227, 6, 19, 0.3); display: flex; align-items: center; justify-content: center; background: #000; flex-shrink: 0; overflow: hidden; }
        .bubble { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 13px; line-height: 1.6; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .bot-bubble { background: rgba(22, 22, 22, 0.9); border-left: 3px solid var(--primary); color: #efefef; }
        .user-bubble { background: rgba(227, 6, 19, 0.05); border-right: 3px solid #444; color: #d1d5db; }
        .wiki-tag { display: block; margin-top: 10px; padding: 8px; background: rgba(227, 6, 19, 0.1); border: 1px dashed var(--primary); font-size: 10px; color: #fff; border-radius: 4px; }
        .wiki-link { color: #ff4d4d; font-weight: bold; text-decoration: underline; }
        .typing::after { content: '|'; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-pdf { 
            display: inline-block; margin-top: 12px; padding: 6px 12px; background: rgba(227, 6, 19, 0.2); 
            border: 1px solid #e30613; color: #fff; font-size: 9px; font-weight: bold; border-radius: 4px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .btn-pdf:hover { background: #e30613; }
        #voice-anim { display: flex; align-items: center; gap: 3px; height: 15px; opacity: 0; }
        .v-bar { width: 2px; height: 100%; background: var(--primary); animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { height: 4px; } to { height: 15px; } }
    </style>
</head>
<body class="scanline">

    <header class="h-16 border-b border-red-900/40 bg-black flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_#e30613]"></div>
            <span class="text-xs font-bold tracking-[0.3em] uppercase">UNINTA <span class="text-red-600">UNTBOT_V5</span></span>
        </div>
        <div id="voice-anim"><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div></div>
        <div class="flex items-center gap-3 bg-red-950/20 px-3 py-1.5 rounded-full border border-red-900/50">
            <div class="w-6 h-6 rounded-full bg-red-900 flex items-center justify-center text-[10px]">👤</div>
            <span id="user-tag" class="text-[10px] text-red-400 font-bold uppercase tracking-tighter">AGUARDANDO_ID</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 flex flex-col p-4 md:p-6 gap-4 relative overflow-hidden">
            <div class="flex flex-col md:flex-row gap-4 h-auto md:h-52 flex-shrink-0">
                <div id="avatar-box" class="w-full md:w-48 h-40 md:h-full glass-card flex flex-col items-center justify-center p-4">
                    <lottie-player src="Ai Robot Vector Art.json" background="transparent" speed="1" style="width: 100px; height: 100px;" loop autoplay></lottie-player>
                    <div id="robot-state" class="text-[8px] font-bold text-red-600 uppercase tracking-[0.2em] mt-3">Sincronizado</div>
                </div>
                <div id="brain-container" class="flex-1 h-32 md:h-full glass-card relative overflow-hidden border border-red-900/10"></div>
            </div>

            <div id="chat-display" class="flex-1 glass-card p-6 overflow-y-auto no-scrollbar space-y-4"></div>

            <div class="h-20 glass-card flex items-center px-6 gap-4 border-red-600/20 relative">
                <input type="text" id="userInput" class="flex-1 bg-transparent border-none outline-none text-red-100 text-sm" placeholder="Injete o comando..." autocomplete="off">
                <button id="btnEnviar" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded text-[10px] font-bold tracking-widest uppercase shadow-lg transition-all active:scale-95">Scanner⚡</button>
                <div id="loading-bar" class="absolute bottom-0 left-0 h-[2px] bg-red-600 w-0 transition-all duration-700"></div>
            </div>
        </main>
    </div>

    <script type="module">
        const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
        const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";

        const input = document.getElementById('userInput');
        const display = document.getElementById('chat-display');
        const userTag = document.getElementById('user-tag');
        const bar = document.getElementById('loading-bar');
        const voiceAnim = document.getElementById('voice-anim');
        let currentUserId = localStorage.getItem('untbot_last_id');

        // WIKIPEDIA CORE
        async function fetchWiki(query) {
            try {
                // Filtra o termo para buscar apenas substantivos próprios ou termos técnicos
                const term = query.split(' ').filter(w => w.length > 3).slice(-2).join(' ');
                const res = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term)}`);
                const data = await res.json();
                return data.type === 'standard' ? { content: data.extract, url: data.content_urls.desktop.page, title: data.title } : null;
            } catch (e) { return null; }
        }

        // VOZ GRADIO
        async function falar(texto) {
            try {
                voiceAnim.style.opacity = "1";
                const client = await window.GradioClient.connect("Ttheus/uninta-voice");
                const result = await client.predict("/sintetizar", { text: texto });
                if (result.data) {
                    const audio = new Audio(result.data[0].url);
                    audio.play();
                    audio.onended = () => voiceAnim.style.opacity = "0";
                }
            } catch (e) { voiceAnim.style.opacity = "0"; }
        }

        function exportarParaPDF(texto) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(0, 0, 0); doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(227, 6, 19); doc.setFontSize(16); doc.text("UNINTA NEURAL REPORT", 15, 20);
            doc.setTextColor(255, 255, 255); doc.setFontSize(10);
            const lines = doc.splitTextToSize(texto, 180);
            doc.text(lines, 15, 40);
            doc.save(`untbot_${currentUserId}.pdf`);
        }

        async function salvarNoRedis(usuario, msg) { await fetch(`${REDIS_URL}/lpush/${usuario}/${encodeURIComponent(msg)}?_token=${REDIS_TOKEN}`); }
        async function buscarDoRedis(usuario) { try { const res = await fetch(`${REDIS_URL}/lrange/${usuario}/0/5?_token=${REDIS_TOKEN}`); const data = await res.json(); return data.result || []; } catch(e) { return []; } }

        function addMessageToUI(role, text, wiki = null) {
            const isBot = role === 'bot';
            const row = document.createElement('div');
            row.className = `msg-row ${isBot ? 'bot' : 'user'}`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isBot ? 'bot-bubble' : 'user-bubble'}`;
            row.innerHTML = `<div class="avatar-circle">${isBot ? '🤖' : '👤'}</div>`;
            row.appendChild(bubble);
            display.appendChild(row);
            
            if (isBot) {
                let i = 0; bubble.classList.add('typing');
                const interval = setInterval(() => {
                    if (i < text.length) { bubble.innerHTML += text.charAt(i); i++; display.scrollTop = display.scrollHeight; }
                    else { 
                        clearInterval(interval); bubble.classList.remove('typing');
                        if(wiki) {
                            const wTag = document.createElement('div');
                            wTag.className = "wiki-tag";
                            wTag.innerHTML = `📚 <b>Wiki Ref:</b> ${wiki.title}<br><a href="${wiki.url}" target="_blank" class="wiki-link">Ver na Wikipedia →</a>`;
                            bubble.appendChild(wTag);
                        }
                        const btn = document.createElement('button');
                        btn.className = "btn-pdf"; btn.innerText = "Exportar PDF";
                        btn.onclick = () => exportarParaPDF(text);
                        bubble.appendChild(btn);
                    }
                }, 15);
            } else { bubble.innerText = text; }
            display.scrollTop = display.scrollHeight;
        }

        async function enviar() {
            const txt = input.value.trim();
            if(!txt) return;

            if(!currentUserId) {
                currentUserId = txt.toLowerCase();
                localStorage.setItem('untbot_last_id', currentUserId);
                userTag.innerText = currentUserId.toUpperCase();
                addMessageToUI('bot', `SISTEMA RECONHECIDO. BEM-VINDO AO LAB, ${currentUserId.toUpperCase()}.`);
                input.value = ""; return;
            }

            addMessageToUI('user', txt);
            bar.style.width = "100%";
            input.value = ""; input.disabled = true;

            const wikiData = await fetchWiki(txt);
            const historico = await buscarDoRedis(currentUserId);
            
            const context = `
            Persona: UNTBOT V5, lab assistant de Tianguá.
            Histórico: ${historico.join(' | ')}
            Wikipedia Context: ${wikiData ? wikiData.content : 'N/A'}
            Instrução: Responda de forma técnica e curta.
            `;

            try {
                const res = await fetch("/api/analisar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: txt, systemContext: context })
                });
                const data = await res.json();
                const resp = data.choices[0].message.content;
                
                await salvarNoRedis(currentUserId, `Eu: ${txt} | Bot: ${resp}`);
                addMessageToUI('bot', resp, wikiData);
                falar(resp);
            } catch (e) { addMessageToUI('bot', "ERRO CRÍTICO NA CONEXÃO NEURAL."); }
            finally { bar.style.width = "0%"; input.disabled = false; input.focus(); }
        }

        document.getElementById('btnEnviar').onclick = enviar;
        input.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };

        // 3D BRAIN
        const brainCont = document.getElementById('brain-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, brainCont.clientWidth/brainCont.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(brainCont.clientWidth, brainCont.clientHeight);
        brainCont.appendChild(renderer.domElement);
        const brain = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 2), new THREE.MeshPhongMaterial({ color: 0xe30613, wireframe: true, transparent: true, opacity: 0.3 }));
        scene.add(brain);
        const light = new THREE.PointLight(0xffffff, 1, 100); light.position.set(10, 10, 10); scene.add(light);
        camera.position.z = 4.5;
        function animate() { requestAnimationFrame(animate); brain.rotation.y += 0.005; renderer.render(scene, camera); }
        animate();

        window.onload = () => { 
            if(currentUserId) {
                userTag.innerText = currentUserId.toUpperCase();
                addMessageToUI('bot', `CONEXÃO ESTABELECIDA. AGUARDANDO COMANDOS, ${currentUserId.toUpperCase()}.`);
            } else {
                addMessageToUI('bot', "SISTEMA UNINTA ONLINE. POR FAVOR, INJETE SEU ID DE ACESSO.");
            }
        };
    </script>
</body>
</html>
