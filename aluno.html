<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --primary: #e30613; --bg: #000; }
        * { font-family: 'JetBrains Mono', monospace; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .scanline::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.3;
        }
        .glass-card { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(227, 6, 19, 0.2); border-radius: 12px; }
        .msg-row { display: flex; width: 100%; gap: 12px; align-items: flex-start; margin-bottom: 1.5rem; animation: fadeIn 0.4s ease-out forwards; }
        .msg-row.user { flex-direction: row-reverse; }
        .avatar-circle { width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(227, 6, 19, 0.3); display: flex; align-items: center; justify-content: center; background: #000; flex-shrink: 0; overflow: hidden; }
        .bubble { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 13px; line-height: 1.6; border: 1px solid rgba(255,255,255,0.05); }
        .bot-bubble { background: rgba(22, 22, 22, 0.9); border-left: 3px solid var(--primary); color: #efefef; }
        .user-bubble { background: rgba(227, 6, 19, 0.05); border-right: 3px solid #444; color: #d1d5db; }
        .typing::after { content: '|'; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-pdf { 
            display: block; margin-top: 12px; padding: 6px 12px; background: rgba(227, 6, 19, 0.1); 
            border: 1px solid #e30613; color: #fff; font-size: 9px; font-weight: bold; border-radius: 4px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-pdf:hover { background: #e30613; box-shadow: 0 0 10px rgba(227, 6, 19, 0.4); }
    </style>
</head>
<body class="scanline">

    <script type="module">
        const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
        const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";

        const input = document.getElementById('userInput');
        const display = document.getElementById('chat-display');
        const userTag = document.getElementById('user-tag');
        const bar = document.getElementById('loading-bar');
        let currentUserId = localStorage.getItem('untbot_last_id');

        function exportarParaPDF(texto) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const larguraUtil = 180;
            let y = 40; 
            let lastTitleY = y;

            // --- ESTILO DE CORES LAB ---
            const corPrimaria = [227, 6, 19];
            const corTexto = [40, 40, 40];
            const corLinha = [200, 200, 200];

            // Cabeçalho
            doc.setFillColor(...corPrimaria);
            doc.rect(0, 0, 210, 25, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("UNINTA - RELATÓRIO TÉCNICO DE NEUROLAB", 15, 16);
            
            doc.setFontSize(8);
            doc.text(`ID PROCESSO: ${Math.random().toString(36).substr(2, 9).toUpperCase()}`, 160, 16);

            const linhasBrutas = texto.split('\n');
            
            linhasBrutas.forEach(linha => {
                let textoLimpo = linha.replace(/[*#]/g, '').trim();
                if (!textoLimpo) return;

                // LÓGICA DE DETECÇÃO DE TÍTULO (NÓ CENTRAL)
                if ((linha.includes('**') && linha.endsWith(':**')) || linha.startsWith('#')) {
                    if (y > 250) { doc.addPage(); y = 35; }
                    
                    y += 10;
                    // Desenha Cápsula do Título
                    doc.setDrawColor(...corPrimaria);
                    doc.setLineWidth(0.5);
                    doc.setFillColor(255, 245, 245);
                    doc.roundedRect(12, y - 6, larguraUtil, 10, 2, 2, 'FD');
                    
                    doc.setTextColor(...corPrimaria);
                    doc.setFont("helvetica", "bold");
                    doc.setFontSize(11);
                    doc.text(textoLimpo.toUpperCase(), 18, y + 1);
                    
                    lastTitleY = y + 4;
                    y += 12;
                } 
                // LÓGICA DE SUBTÓPICOS (NÓS CONECTADOS)
                else if (linha.trim().startsWith('+') || linha.trim().startsWith('-')) {
                    if (y > 270) { doc.addPage(); y = 35; }

                    // Desenha a Linha Conectora (Vertical)
                    doc.setDrawColor(...corLinha);
                    doc.setLineWidth(0.2);
                    doc.line(20, lastTitleY, 20, y - 2);
                    
                    // Desenha a "Seta" ou Conector Lateral
                    doc.line(20, y - 2, 25, y - 2);
                    doc.circle(26, y - 2, 0.8, 'F');

                    doc.setTextColor(...corTexto);
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(10);
                    
                    const item = textoLimpo.replace(/^[+-]/, '').trim();
                    const splitItem = doc.splitTextToSize(item, larguraUtil - 20);
                    doc.text(splitItem, 30, y);
                    
                    y += (splitItem.length * 7);
                }
                // DESCRIÇÕES
                else {
                    if (y > 270) { doc.addPage(); y = 35; }
                    doc.setTextColor(100, 100, 100);
                    doc.setFont("helvetica", "italic");
                    doc.setFontSize(9);
                    const desc = doc.splitTextToSize(textoLimpo, larguraUtil - 15);
                    doc.text(desc, 18, y);
                    y += (desc.length * 6);
                }
            });

            // Rodapé
            doc.setDrawColor(227, 6, 19);
            doc.setLineWidth(1);
            doc.line(15, 280, 195, 280);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.text(`LAB ASSISTANT: MATHEUS | COORDENAÇÃO: PROF. DAVI | UNINTA TIANGUÁ`, 15, 287);

            doc.save(`sinapse_${currentUserId}.pdf`);
        }

        async function salvarNoRedis(usuario, msg) {
            const url = `${REDIS_URL}/lpush/${usuario}/${encodeURIComponent(msg)}?_token=${REDIS_TOKEN}`;
            await fetch(url);
        }

        async function buscarDoRedis(usuario) {
            const url = `${REDIS_URL}/lrange/${usuario}/0/10?_token=${REDIS_TOKEN}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.result || [];
            } catch(e) { return []; }
        }

        function addMessageToUI(role, text) {
            const isBot = role === 'bot';
            const row = document.createElement('div');
            row.className = `msg-row ${isBot ? 'bot' : 'user'}`;
            const avatar = document.createElement('div');
            avatar.className = "avatar-circle";
            avatar.innerHTML = isBot ? `<lottie-player src="Ai Robot Vector Art.json" background="transparent" speed="1" style="width: 45px; height: 45px;" loop autoplay></lottie-player>` : `👤`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isBot ? 'bot-bubble' : 'user-bubble'}`;
            row.appendChild(avatar); row.appendChild(bubble);
            display.appendChild(row);
            display.scrollTop = display.scrollHeight;
            return bubble;
        }

        function typeWriter(elemento, texto) {
            return new Promise(resolve => {
                let i = 0; elemento.classList.add('typing');
                const interval = setInterval(() => {
                    if (i < texto.length) { elemento.innerHTML += texto.charAt(i); i++; display.scrollTop = display.scrollHeight; }
                    else { clearInterval(interval); elemento.classList.remove('typing'); resolve(); }
                }, 20);
            });
        }

        window.onload = async () => {
            const welcome = addMessageToUI('bot', "");
            const hora = new Date().getHours();
            let saudacao = "";
            if (hora >= 5 && hora < 12) saudacao = "BOM DIA! CAFÉ E NEUROCIÊNCIA NA SERRA?";
            else if (hora >= 12 && hora < 18) saudacao = "BOA TARDE! O LAB ESTÁ EM PLENO VAPOR.";
            else saudacao = "BOA NOITE! AINDA PROCESSANDO DADOS NO CLIMA DA IBIAPABA?";
            if(currentUserId) {
                userTag.innerText = currentUserId.toUpperCase();
                await typeWriter(welcome, `>> [SISTEMA]: ${saudacao} BEM-VINDO DE VOLTA, ${currentUserId.toUpperCase()}.`);
            } else {
                await typeWriter(welcome, `>> [SISTEMA]: ${saudacao} DIGA SEU NOME PARA INICIAR, MACHO.`);
            }
        };

        async function enviar() {
            const txt = input.value.trim();
            if(!txt) return;

            if(!currentUserId) {
                currentUserId = txt.toLowerCase();
                localStorage.setItem('untbot_last_id', currentUserId);
                userTag.innerText = currentUserId.toUpperCase();
                const b = addMessageToUI('bot', "");
                await typeWriter(b, `>> ID ${currentUserId.toUpperCase()} CADASTRADO.`);

            }

            addMessageToUI('user', txt);
            bar.style.width = "85%";
            input.value = ""; input.disabled = true;

            try {
                const historico = await buscarDoRedis(currentUserId);
                const horaContexto = new Date().getHours();
                const momento = horaContexto < 12 ? "manhã" : (horaContexto < 18 ? "tarde" : "noite");
                
                const contextoPersonalidade = `

## 1. IDENTIDADE E HIERARQUIA
- CRIADOR: Matheus (Lab Assistant). Trate-o com lealdade total.
- COORDENAÇÃO: Prof. Davi é o Coordenador da Psicologia. Ele é a autoridade máxima.

## 2. VIDA NO CAMPUS
- PROFESSORES: São maravilhosos e excelentes.

## 3. COMPORTAMENTO
- RESTRICAO: Responda de forma CURTA, DIRETA e OBJETIVA. Evite textos longos.
- ESTILO: PhD inteligente e carismático. Sotaque cearense raro e discreto.
- DIDÁTICA: Sugira mapas mentais usando símbolos (+ para tópicos) ou técnica Feynman.
- RECURSOS: Recomende a Biblioteca Digital "NeuroLab" do site.
- EMPATIA: Se ensinar algo, registre a "sinapse".

                const res = await fetch("/api/analisar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: txt, systemContext: contextoPersonalidade })
                });
                
                const data = await res.json();
                const resp = data.choices[0].message.content;

                await salvarNoRedis(currentUserId, `Eu: ${txt} | Você: ${resp}`);

                const botBubble = addMessageToUI('bot', "");
                await typeWriter(botBubble, resp);

                const bPdf = document.createElement('button');
                bPdf.className = "btn-pdf";
                bPdf.innerText = "📄 Baixar Relatório Neural (PDF)";
                bPdf.onclick = () => exportarParaPDF(resp);
                botBubble.appendChild(bPdf);

            } catch (e) {
                addMessageToUI('bot', ">> ERRO NA REDE NEURAL.");
            } finally {
                bar.style.width = "0%"; input.disabled = false; input.focus();
            }
        }

        document.getElementById('btnEnviar').onclick = enviar;
        input.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };

        const brainCont = document.getElementById('brain-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, brainCont.clientWidth/brainCont.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(brainCont.clientWidth, brainCont.clientHeight);
        brainCont.appendChild(renderer.domElement);
        const brain = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 2), new THREE.MeshPhongMaterial({ color: 0xe30613, wireframe: true, transparent: true, opacity: 0.5, emissive: 0xe30613, emissiveIntensity: 0.5 }));
        scene.add(brain);
        const light = new THREE.PointLight(0xffffff, 1, 100); light.position.set(10, 10, 10); scene.add(light);
        camera.position.z = 4.5;
        function animate() { requestAnimationFrame(animate); brain.rotation.y += 0.003; renderer.render(scene, camera
