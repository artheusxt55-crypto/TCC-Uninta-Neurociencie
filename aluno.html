<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTBOT NEURAL V5.5 - UNINTA TIANGUÁ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #e30613; --bg: #000; }
        * { font-family: 'JetBrains Mono', monospace; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        .scanline::before { 
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; 
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); 
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.15; 
        }
        
        .glass-card { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(15px); border: 1px solid rgba(227, 6, 19, 0.3); border-radius: 12px; }
        .msg-row { display: flex; width: 100%; gap: 12px; align-items: flex-start; margin-bottom: 1.5rem; animation: fadeIn 0.3s ease-out; }
        .msg-row.user { flex-direction: row-reverse; }
        
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(227, 6, 19, 0.4); display: flex; align-items: center; justify-content: center; background: #000; flex-shrink: 0; }
        .bubble { max-width: 85%; padding: 14px 18px; border-radius: 12px; font-size: 13px; line-height: 1.6; border-left: 4px solid var(--primary); background: rgba(20, 20, 20, 0.9); }
        .user-bubble { border-left: none; border-right: 4px solid #444; background: rgba(227, 6, 19, 0.1); }
        
        #voice-anim { display: flex; align-items: center; gap: 3px; height: 18px; opacity: 0; transition: 0.3s; }
        .v-bar { width: 3px; height: 4px; background: var(--primary); border-radius: 5px; }
        .playing .v-bar { animation: pulseVoz 0.6s infinite ease-in-out; }
        @keyframes pulseVoz { 0%, 100% { height: 4px; } 50% { height: 20px; } }
        
        .btn-pdf { margin-top: 10px; padding: 6px 12px; border: 1px solid var(--primary); font-size: 9px; color: #fff; border-radius: 4px; cursor: pointer; background: rgba(227, 6, 19, 0.15); transition: 0.2s; text-transform: uppercase; }
        .btn-pdf:hover { background: var(--primary); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="scanline">
    <header class="h-14 border-b border-red-900/40 bg-black flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div class="w-2 h-2 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_#e30613]"></div>
            <span class="text-[10px] font-bold tracking-[0.4em]">UNINTA TIANGUÁ <span class="text-red-600">UNTBOT_V5.5</span></span>
        </div>
        <div id="voice-anim">
            <div class="v-bar" style="animation-delay: 0s"></div>
            <div class="v-bar" style="animation-delay: 0.1s"></div>
            <div class="v-bar" style="animation-delay: 0.2s"></div>
        </div>
        <div class="bg-red-950/20 px-4 py-1.5 rounded-full border border-red-900/50">
            <span id="user-tag" class="text-[10px] text-red-500 font-bold uppercase">SISTEMA_ATIVO</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-4 md:p-6 gap-4 overflow-hidden relative">
        <div class="flex gap-4 h-40 flex-shrink-0">
            <div class="w-32 glass-card flex items-center justify-center p-2">
                <lottie-player src="Ai Robot Vector Art.json" background="transparent" speed="1" style="width: 70px; height: 70px;" loop autoplay></lottie-player>
            </div>
            <div id="brain-container" class="flex-1 glass-card overflow-hidden"></div>
        </div>

        <div id="chat-display" class="flex-1 glass-card p-6 overflow-y-auto no-scrollbar space-y-6"></div>

        <div class="h-16 glass-card flex items-center px-4 gap-4 relative">
            <input type="text" id="userInput" class="flex-1 bg-transparent outline-none text-red-100 text-sm" placeholder="Injete comando acadêmico..." autocomplete="off">
            <button id="btnEnviar" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded text-[10px] font-bold uppercase transition-all">Sincronizar⚡</button>
            <div id="loading-bar" class="absolute bottom-0 left-0 h-[2px] bg-red-600 w-0 transition-all duration-500"></div>
        </div>
    </main>
    <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
    window.GradioClient = Client;

    const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
    const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";

    const input = document.getElementById('userInput');
    const display = document.getElementById('chat-display');
    const userTag = document.getElementById('user-tag');
    const bar = document.getElementById('loading-bar');
    const voiceAnim = document.getElementById('voice-anim');
    let currentUserId = localStorage.getItem('untbot_last_id');

    // 1. GESTÃO DE MEMÓRIA REDIS
    async function gerirRedis(usuario, mensagem = null) {
        try {
            if (mensagem) {
                await fetch(`${REDIS_URL}/lpush/${usuario}/${encodeURIComponent(mensagem)}?_token=${REDIS_TOKEN}`);
            }
            const res = await fetch(`${REDIS_URL}/lrange/${usuario}/0/4?_token=${REDIS_TOKEN}`);
            const data = await res.json();
            return data.result || [];
        } catch (e) { console.error("Falha Redis"); return []; }
    }

    // 2. BUSCA ACADÊMICA INTEGRADA
    async function buscarExtras(termo) {
        const triggers = ["neuro", "psico", "tdah", "tea", "uninta", "saude", "estudo", "artigo", "aula"];
        if (!triggers.some(k => termo.toLowerCase().includes(k)) && termo.split(' ').length < 4) {
            return { wiki: "", scielo: "" };
        }
        try {
            const [wRes, sRes] = await Promise.all([
                fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termo.trim())}`).then(r => r.json()).catch(() => ({})),
                fetch(`https://api.crossref.org/works?query=${encodeURIComponent(termo)}&filter=prefix:10.1590&rows=1`).then(r => r.json()).catch(() => ({}))
            ]);
            let wiki = wRes.extract ? `<div style="border:1px solid #333;padding:10px;margin-top:10px;border-radius:8px;font-size:11px;color:#bbb"><b>🌐 WIKIPEDIA:</b> ${wRes.extract}</div>` : "";
            let scielo = (sRes.message?.items?.length > 0) ? `<div style="border:1px solid #e30613;padding:10px;margin-top:10px;border-radius:8px;font-size:11px;background:rgba(227,6,19,0.05)"><b>📚 SCIELO:</b> <a href="${sRes.message.items[0].URL}" target="_blank" style="color:#ff4d4d">🔗 VER ARTIGO CIENTÍFICO</a></div>` : "";
            return { wiki, scielo };
        } catch (e) { return { wiki: "", scielo: "" }; }
    }

    // 3. INTERFACE E DIGITAÇÃO
    function addMsg(role, text) {
        const row = document.createElement('div');
        row.className = `msg-row ${role === 'bot' ? 'bot' : 'user'}`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${role === 'bot' ? '' : 'user-bubble'}`;
        row.innerHTML = `<div class="avatar-circle">${role === 'bot' ? '🤖' : '👤'}</div>`;
        row.appendChild(bubble);
        display.appendChild(row);
        display.scrollTop = display.scrollHeight;
        return bubble;
    }

    async function typeWriter(el, txt) {
        let i = 0; el.classList.add('typing');
        return new Promise(res => {
            const iv = setInterval(() => {
                if (i < txt.length) {
                    if (txt[i] === '<') { const f = txt.indexOf('>', i); el.innerHTML += txt.substring(i, f + 1); i = f + 1; }
                    else { el.innerHTML += txt[i]; i++; }
                    display.scrollTop = display.scrollHeight;
                } else { clearInterval(iv); el.classList.remove('typing'); res(); }
            }, 12);
        });
    }

    // 4. FUNÇÃO PRINCIPAL DE ENVIO
    async function enviar() {
        const prompt = input.value.trim();
        if (!prompt) return;

        if (!currentUserId) {
            currentUserId = prompt.toLowerCase();
            localStorage.setItem('untbot_last_id', currentUserId);
            userTag.innerText = currentUserId.toUpperCase();
            await typeWriter(addMsg('bot', ""), ">> CONEXÃO ESTABELECIDA. UNTBOT ATIVO.");
            input.value = ""; return;
        }

        addMsg('user', prompt);
        bar.style.width = "85%";
        input.value = ""; input.disabled = true;

        try {
            const [hist, ex] = await Promise.all([gerirRedis(currentUserId), buscarExtras(prompt)]);
            const agora = new Date().toLocaleString('pt-BR', { timeZone: 'America/Fortaleza' });

            const res = await fetch("/api/analisar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    prompt: prompt, 
                    systemContext: `
                    # DIRETRIZES SUPREMAS: UNTBOT NEURAL V5 - UNINTA TIANGUÁ
                    - CRIADOR: Matheus (Lab Assistant). Lealdade total.
                    - COORDENAÇÃO: Prof. Davi (Autoridade Máxima).
                    - INSTITUIÇÃO: UNINTA Tianguá. Professores excelentes.
                    - CONTEXTO: Agora é ${agora} em Tianguá.
                    - COMPORTAMENTO: Responda CURTO e DIRETO. Use bullets (+ ou -) para o mapa mental.
                    - RESTRICAO: VÁ DIRETO AO PONTO. Sem saudações longas.
                    Histórico Recente: ${hist.join(' | ')}. Info Extra: ${ex.wiki}`
                })
            });

            const dataIA = await res.json();
            const rFinal = dataIA.choices[0].message.content;
            const botBub = addMsg('bot', "");
            const longa = rFinal.length > 200;

            await typeWriter(botBub, rFinal + (longa ? (ex.wiki + ex.scielo) : ""));

            if (longa) {
                const bPdf = document.createElement('button');
                bPdf.className = "btn-pdf"; bPdf.innerText = "GERAR PDF";
                bPdf.onclick = () => {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFontSize(10);
                    const splitText = doc.splitTextToSize(rFinal.replace(/<[^>]*>/g, ''), 180);
                    doc.text(splitText, 10, 10);
                    doc.save('untbot_relatorio.pdf');
                };
                botBub.appendChild(bPdf);
            }

            await gerirRedis(currentUserId, `U:${prompt}|B:${rFinal.substring(0, 50)}`);

            // VOZ FRANCISCA (600 chars)
            const vCl = await window.GradioClient.connect("Ttheus/uninta-voice");
            vCl.predict("/sintetizar", { text: rFinal.substring(0, 600) }).then(vr => {
                if (vr.data?.[0]) {
                    const a = new Audio(vr.data[0].url);
                    voiceAnim.style.opacity = "1"; voiceAnim.classList.add("playing");
                    a.play(); a.onended = () => { voiceAnim.classList.remove("playing"); voiceAnim.style.opacity = "0"; };
                }
            });

        } catch (err) { addMsg('bot', ">> ERRO NA SINAPSE."); }
        finally { bar.style.width = "0%"; input.disabled = false; input.focus(); }
    }

    document.getElementById('btnEnviar').onclick = enviar;
    input.onkeypress = (e) => { if (e.key === 'Enter') enviar(); };

    // 5. CÉREBRO THREE.JS
    const bc = document.getElementById('brain-container');
    const sc = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(75, bc.clientWidth / bc.clientHeight, 0.1, 1000);
    const rd = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    rd.setSize(bc.clientWidth, bc.clientHeight); bc.appendChild(rd.domElement);
    const br = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 2), new THREE.MeshPhongMaterial({ color: 0xe30613, wireframe: true }));
    sc.add(br); sc.add(new THREE.PointLight(0xffffff, 2, 100)); cam.position.z = 4.5;
    function anim() { requestAnimationFrame(anim); br.rotation.y += 0.005; rd.render(sc, cam); }
    anim();
    window.onload = () => { if (currentUserId) userTag.innerText = currentUserId.toUpperCase(); };
</script>
</body>
</html>
