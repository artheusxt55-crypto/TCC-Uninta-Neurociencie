<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTBOT NEURAL - UNINTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client; 
    </script>
    <style>
        :root { --primary: #e30613; --bg: #000; }
        * { font-family: 'JetBrains Mono', monospace; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .glass-card { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(227, 6, 19, 0.2); border-radius: 12px; }
        .msg-row { display: flex; gap: 12px; margin-bottom: 1.5rem; animation: fadeIn 0.4s ease-out; }
        .msg-row.user { flex-direction: row-reverse; }
        .bubble { max-width: 80%; padding: 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; }
        .bot-bubble { background: rgba(22, 22, 22, 0.9); border-left: 3px solid var(--primary); }
        .user-bubble { background: rgba(227, 6, 19, 0.05); border-right: 3px solid #444; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="h-16 border-b border-red-900/40 bg-black flex items-center justify-between px-6 z-50">
    <div class="flex items-center gap-3">
        <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_#e30613]"></div>
        <span class="text-xs font-bold uppercase tracking-widest">UNINTA <span class="text-red-600">UNTBOT_V5</span></span>
    </div>
    <div class="flex items-center gap-3">
        <span id="user-tag" class="text-[10px] text-red-400 font-bold uppercase">AGUARDANDO_ID</span>
    </div>
</header>

<main class="flex-1 flex flex-col p-4 md:p-6 gap-4 overflow-hidden">
    <div class="flex flex-col md:flex-row gap-4 h-40 md:h-52 flex-shrink-0">
        <div class="w-full md:w-48 glass-card flex flex-col items-center justify-center p-4">
            <lottie-player src="Ai Robot Vector Art.json" background="transparent" speed="1" style="width: 80px; height: 80px;" loop autoplay></lottie-player>
            <div class="text-[8px] font-bold text-red-600 uppercase mt-2">Neural Active</div>
        </div>
        <div id="brain-container" class="flex-1 glass-card relative overflow-hidden"></div>
    </div>

    <div id="chat-display" class="flex-1 glass-card p-6 overflow-y-auto no-scrollbar space-y-4"></div>

    <div class="h-20 glass-card flex items-center px-6 gap-4 border-red-600/20">
        <input type="text" id="userInput" class="flex-1 bg-transparent border-none outline-none text-red-100 text-sm" placeholder="Injete o comando..." autocomplete="off">
        <button id="btnEnviar" class="bg-red-600 text-white px-6 py-2 rounded text-[10px] font-bold uppercase">Scanner⚡</button>
    </div>
</main>

<script>
    const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
    const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";
    
    let DIRETRIZES_SUPREMAS = ""; 
    let audioCtx, analyser, dataArray, source, isSpeaking = false;
    let currentUserId = localStorage.getItem('untbot_last_id');

    const input = document.getElementById('userInput');
    const display = document.getElementById('chat-display');
    const userTag = document.getElementById('user-tag');

    // --- MOTOR 3D REATIVO ---
    const brainCont = document.getElementById('brain-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, brainCont.clientWidth / brainCont.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(brainCont.clientWidth, brainCont.clientHeight);
    brainCont.appendChild(renderer.domElement);
    const orbe = new THREE.Mesh(new THREE.SphereGeometry(2, 64, 64), new THREE.MeshPhongMaterial({ color: 0xe30613, emissive: 0x440000, shininess: 100 }));
    scene.add(orbe);
    const light = new THREE.PointLight(0xffffff, 1.2, 100); light.position.set(5, 5, 5); scene.add(light);
    camera.position.z = 5;

    function animate() {
        requestAnimationFrame(animate);
        if (isSpeaking && dataArray) {
            analyser.getByteFrequencyData(dataArray);
            let vol = dataArray.reduce((a, b) => a + b) / dataArray.length;
            let s = 1 + (vol / 60);
            orbe.scale.set(s, s, s);
        } else {
            let s = 1 + Math.sin(Date.now() * 0.002) * 0.05;
            orbe.scale.set(s, s, s);
        }
        orbe.rotation.y += 0.005;
        renderer.render(scene, camera);
    }
    animate();

    // --- LOGICA DE DADOS ---
    async function buscarWikipedia(termo) {
        try {
            const res = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termo)}`);
            const data = await res.json();
            return data.extract ? `\n[WIKIPEDIA]: ${data.extract}` : "";
        } catch (e) { return ""; }
    }

    window.onload = async () => {
        const res = await fetch(`${REDIS_URL}/get/DIRETRIZES_MESTRE?_token=${REDIS_TOKEN}`);
        const data = await res.json();
        DIRETRIZES_SUPREMAS = data.result || "";
        if(currentUserId) userTag.innerText = currentUserId.toUpperCase();
    };

    async function enviar() {
        const txt = input.value.trim();
        if(!txt) return;
        if(!currentUserId) { currentUserId = txt.toLowerCase(); localStorage.setItem('untbot_last_id', currentUserId); userTag.innerText = currentUserId.toUpperCase(); input.value=""; return; }

        addMsg('user', txt);
        input.value = "";
        
        const wiki = await buscarWikipedia(txt);
        const momento = new Date().getHours() < 12 ? "manhã" : (new Date().getHours() < 18 ? "tarde" : "noite");
        const context = `${DIRETRIZES_SUPREMAS.replace('${momento}', momento)} ${wiki}`;

        const res = await fetch("/api/analisar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: txt, systemContext: context })
        });
        const d = await res.json();
        const resp = d.choices[0].message.content;
        
        const bubble = addMsg('bot', resp);
        falar(resp);
    }

    function addMsg(role, text) {
        const row = document.createElement('div');
        row.className = `msg-row ${role === 'bot' ? 'bot' : 'user'}`;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${role === 'bot' ? 'bot-bubble' : 'user-bubble'}`;
        bubble.innerText = text;
        row.appendChild(bubble);
        display.appendChild(row);
        display.scrollTop = display.scrollHeight;
        return bubble;
    }

    async function falar(t) {
        try {
            const client = await window.GradioClient.connect("Ttheus/uninta-voice");
            const res = await client.predict("/sintetizar", { text: t.replace(/[+*-]/g, '') });
            if (res.data[0]) {
                if (!audioCtx) audioCtx = new AudioContext();
                if (!analyser) { analyser = audioCtx.createAnalyser(); analyser.fftSize = 64; dataArray = new Uint8Array(analyser.frequencyBinCount); }
                const audio = new Audio(res.data[0].url);
                audio.crossOrigin = "anonymous";
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser); analyser.connect(audioCtx.destination);
                isSpeaking = true; audio.play();
                audio.onended = () => isSpeaking = false;
            }
        } catch(e) {}
    }

    document.getElementById('btnEnviar').onclick = enviar;
    input.onkeypress = (e) => e.key === 'Enter' && enviar();
</script>
</body>
</html>
