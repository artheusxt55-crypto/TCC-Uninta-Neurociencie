<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTBOT NEURAL - UNINTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.28/build/spline-viewer.js"></script>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client; 
    </script>

    <style>
        :root { --primary: #e30613; --bg: #000; }
        * { font-family: 'JetBrains Mono', monospace; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        .scanline::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.3;
        }

        .glass-card { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(227, 6, 19, 0.2); border-radius: 12px; }
        
        /* Chat e Bubbles */
        .msg-row { display: flex; width: 100%; gap: 12px; align-items: flex-start; margin-bottom: 1.5rem; animation: fadeIn 0.4s ease-out forwards; }
        .msg-row.user { flex-direction: row-reverse; }
        .avatar-circle { width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(227, 6, 19, 0.3); display: flex; align-items: center; justify-content: center; background: #000; flex-shrink: 0; overflow: hidden; }
        .bubble { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 13px; line-height: 1.6; border: 1px solid rgba(255,255,255,0.05); }
        .bot-bubble { background: rgba(22, 22, 22, 0.9); border-left: 3px solid var(--primary); color: #efefef; }
        .user-bubble { background: rgba(227, 6, 19, 0.05); border-right: 3px solid #444; color: #d1d5db; }
        
        /* Animações */
        @keyframes splinePulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px var(--primary)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(227, 6, 19, 0.5)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px var(--primary)); }
        }
        .speaking-spline { animation: splinePulse 0.4s infinite ease-in-out; }
        .typing::after { content: '|'; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Barras de Voz */
        #voice-anim { display: flex; align-items: center; gap: 3px; height: 20px; opacity: 0; transition: opacity 0.3s; }
        .v-bar { width: 3px; height: 5px; background: var(--primary); border-radius: 5px; }
        .playing .v-bar { animation: pulseVoz 0.6s infinite ease-in-out; }
        @keyframes pulseVoz { 0%, 100% { height: 5px; } 50% { height: 20px; } }

        /* Botões e Tags */
        .btn-pdf { display: inline-block; margin-top: 12px; margin-right: 8px; padding: 6px 12px; background: rgba(227, 6, 19, 0.1); border: 1px solid #e30613; color: #fff; font-size: 9px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-pdf:hover { background: #e30613; box-shadow: 0 0 10px rgba(227, 6, 19, 0.4); }
        .verification-tag { display: block; margin-top: 12px; padding: 8px; background: rgba(255,255,255,0.03); border-left: 2px solid var(--primary); font-size: 10px; color: #aaa; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        spline-viewer { width: 100%; height: 100%; transition: all 0.5s ease; }
    </style>
</head>
<body class="scanline">

    <header class="h-16 border-b border-red-900/40 bg-black flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse shadow-[0_0_10px_#e30613]"></div>
            <span class="text-xs font-bold tracking-[0.3em] uppercase">UNINTA <span class="text-red-600">UNTBOT_V5</span></span>
        </div>
        <div id="voice-anim">
            <div class="v-bar" style="animation-delay: 0s"></div>
            <div class="v-bar" style="animation-delay: 0.1s"></div>
            <div class="v-bar" style="animation-delay: 0.2s"></div>
            <div class="v-bar" style="animation-delay: 0.1s"></div>
        </div>
        <div class="flex items-center gap-3 bg-red-950/20 px-3 py-1.5 rounded-full border border-red-900/50">
            <div class="w-6 h-6 rounded-full bg-red-900 flex items-center justify-center text-[10px]">👤</div>
            <span id="user-tag" class="text-[10px] text-red-400 font-bold uppercase tracking-tighter">AGUARDANDO_ID</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 flex flex-col p-4 md:p-6 gap-4 relative overflow-hidden">
            
            <div class="flex flex-col md:flex-row gap-4 h-64 md:h-80 flex-shrink-0">
                <div id="main-visual" class="flex-1 glass-card relative overflow-hidden border border-red-900/20">
                    <spline-viewer id="bot-sphere" url="ai_assistant_hover_and_click_interaction.spline"></spline-viewer>
                    <div class="absolute bottom-4 left-4 flex items-center gap-2 bg-black/40 p-2 rounded-md">
                        <div id="status-led" class="w-2 h-2 bg-red-900 rounded-full transition-all"></div>
                        <span id="status-text" class="text-[8px] font-bold text-white/30 uppercase tracking-widest">Standby</span>
                    </div>
                </div>
            </div>

            <div id="chat-display" class="flex-1 glass-card p-6 overflow-y-auto no-scrollbar space-y-4"></div>

            <div class="h-20 glass-card flex items-center px-6 gap-4 border-red-600/20 relative">
                <input type="text" id="userInput" class="flex-1 bg-transparent border-none outline-none text-red-100 text-sm" placeholder="Injete o comando..." autocomplete="off">
                <button id="btnEnviar" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded text-[10px] font-bold tracking-widest uppercase shadow-lg transition-all active:scale-95">Scanner⚡</button>
                <div id="loading-bar" class="absolute bottom-0 left-0 h-[2px] bg-red-600 w-0 transition-all duration-700"></div>
            </div>
        </main>
    </div>

    <script type="module">
        const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
        const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";

        const input = document.getElementById('userInput');
        const display = document.getElementById('chat-display');
        const userTag = document.getElementById('user-tag');
        const bar = document.getElementById('loading-bar');
        const voiceAnim = document.getElementById('voice-anim');
        const botSphere = document.getElementById('bot-sphere');
        const statusLed = document.getElementById('status-led');
        const statusText = document.getElementById('status-text');
        
        let currentUserId = localStorage.getItem('untbot_last_id');
        let lastWikiUrl = null, lastWikiTitle = null;

        // Wikipedia e PDF
        async function buscarWikipedia(query) {
            try {
                let termo = query.replace(/[?.,!]/g, '').trim();
                const res = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termo)}`);
                if (res.ok) {
                    const data = await res.json();
                    lastWikiUrl = data.content_urls?.desktop?.page;
                    lastWikiTitle = data.title;
                    return data.extract || "";
                }
                return "";
            } catch (e) { return ""; }
        }

        function exportarParaPDF(texto) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(227, 6, 19); doc.rect(0, 0, 210, 25, 'F');
            doc.setTextColor(255, 255, 255); doc.setFontSize(16);
            doc.text("UNINTA - RELATÓRIO NEURAL", 15, 16);
            doc.setTextColor(50, 50, 50); doc.setFontSize(10);
            const lines = doc.splitTextToSize(texto.replace(/[*#]/g, ''), 180);
            doc.text(lines, 15, 45);
            doc.save(`relatorio_${currentUserId}.pdf`);
        }

        async function salvarNoRedis(usuario, msg) { await fetch(`${REDIS_URL}/lpush/${usuario}/${encodeURIComponent(msg)}?_token=${REDIS_TOKEN}`); }

        function addMessageToUI(role, text) {
            const isBot = role === 'bot';
            const row = document.createElement('div');
            row.className = `msg-row ${isBot ? 'bot' : 'user'}`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isBot ? 'bot-bubble' : 'user-bubble'}`;
            row.innerHTML = `<div class="avatar-circle">${isBot ? '🤖' : '👤'}</div>`;
            row.appendChild(bubble);
            display.appendChild(row);
            display.scrollTop = display.scrollHeight;
            return bubble;
        }

        function typeWriter(elemento, texto) {
            return new Promise(resolve => {
                let i = 0; elemento.classList.add('typing');
                const interval = setInterval(() => {
                    if (i < texto.length) { elemento.innerHTML += texto.charAt(i); i++; display.scrollTop = display.scrollHeight; }
                    else { clearInterval(interval); elemento.classList.remove('typing'); resolve(); }
                }, 20);
            });
        }

        async function enviar() {
            const txt = input.value.trim();
            if(!txt) return;

            if(!currentUserId) {
                currentUserId = txt.toLowerCase();
                localStorage.setItem('untbot_last_id', currentUserId);
                userTag.innerText = currentUserId.toUpperCase();
                await typeWriter(addMessageToUI('bot', ""), `>> ID ${currentUserId.toUpperCase()} REGISTRADO.`);
                input.value = ""; return;
            }

            addMessageToUI('user', txt);
            bar.style.width = "85%";
            input.value = ""; input.disabled = true;

            try {
                const wikiContexto = await buscarWikipedia(txt);
                const res = await fetch("/api/analisar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: txt, systemContext: `UNTBOT na UNINTA. Wiki: ${wikiContexto}` })
                });
                
                const data = await res.json();
                const resp = data.choices[0].message.content;
                const botBubble = addMessageToUI('bot', "");
                await typeWriter(botBubble, resp);

                if (lastWikiTitle) {
                    const selo = document.createElement('div');
                    selo.className = "verification-tag";
                    selo.innerHTML = `🔍 <strong>FONTE:</strong> <a href="${lastWikiUrl}" target="_blank">${lastWikiTitle}</a>`;
                    botBubble.appendChild(selo);
                }

                // Voz e Sincronia com Spline
                try {
                    const vClient = await window.GradioClient.connect("Ttheus/uninta-voice");
                    const vRes = await vClient.predict("/sintetizar", { text: resp });
                    if (vRes.data?.[0]) {
                        const audio = new Audio(vRes.data[0].url);
                        audio.onplay = () => {
                            voiceAnim.style.opacity = "1";
                            voiceAnim.classList.add("playing");
                            botSphere.classList.add("speaking-spline");
                            statusLed.style.backgroundColor = "#22c55e";
                            statusText.innerText = "Transmitindo...";
                            statusText.style.color = "#22c55e";
                        };
                        audio.onended = () => {
                            voiceAnim.classList.remove("playing");
                            voiceAnim.style.opacity = "0";
                            botSphere.classList.remove("speaking-spline");
                            statusLed.style.backgroundColor = "#450a0a";
                            statusText.innerText = "Standby";
                            statusText.style.color = "rgba(255,255,255,0.3)";
                        };
                        audio.play();
                    }
                } catch (vErr) {}

                const bPdf = document.createElement('button');
                bPdf.className = "btn-pdf"; bPdf.innerText = "📄 PDF";
                bPdf.onclick = () => exportarParaPDF(resp);
                botBubble.appendChild(bPdf);
                await salvarNoRedis(currentUserId, `U: ${txt} | B: ${resp}`);

            } catch (e) { addMessageToUI('bot', ">> FALHA DE CONEXÃO."); }
            finally { bar.style.width = "0%"; input.disabled = false; input.focus(); }
        }

        document.getElementById('btnEnviar').onclick = enviar;
        input.onkeypress = (e) => { if(e.key === 'Enter') enviar(); };
        window.onload = () => { if(currentUserId) userTag.innerText = currentUserId.toUpperCase(); };
    </script>
</body>
</html>
