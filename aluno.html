<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTBOT NEURAL V5 - UNINTA TIANGUÁ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
        window.GradioClient = Client; 
    </script>

    <style>
        :root { --primary: #e30613; --primary-glow: rgba(227, 6, 19, 0.4); --bg: #000; --card: rgba(15, 15, 15, 0.9); }
        * { font-family: 'JetBrains Mono', monospace; box-sizing: border-box; cursor: crosshair; }
        
        body { background: var(--bg); color: #fff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Efeito CRT/Scanline de Laboratório */
        .scanline::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100; background-size: 100% 2px, 3px 100%; pointer-events: none; opacity: 0.4;
        }

        .glass-card { 
            background: var(--card); backdrop-filter: blur(15px); 
            border: 1px solid rgba(227, 6, 19, 0.2); border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Sistema de Mensagens Avançado */
        .msg-row { display: flex; width: 100%; gap: 15px; align-items: flex-start; margin-bottom: 2rem; animation: neuralFade 0.5s ease-out; }
        .msg-row.user { flex-direction: row-reverse; }
        
        .avatar-circle { 
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary);
            display: flex; align-items: center; justify-content: center; background: #000;
            flex-shrink: 0; box-shadow: 0 0 15px var(--primary-glow);
        }

        .bubble { 
            max-width: 75%; padding: 18px 22px; border-radius: 18px; font-size: 13.5px; 
            line-height: 1.7; position: relative; transition: all 0.3s ease;
        }

        .bot-bubble { 
            background: rgba(20, 20, 20, 0.95); border-left: 4px solid var(--primary); 
            color: #efefef; box-shadow: 5px 5px 20px rgba(0,0,0,0.5);
        }

        .user-bubble { 
            background: rgba(227, 6, 19, 0.08); border-right: 4px solid #444; 
            color: #d1d5db; text-align: right;
        }

        /* Typography & Math */
        .bubble h1, .bubble h2 { color: var(--primary); font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        .bubble ul { list-style: none; padding-left: 0; }
        .bubble li::before { content: "► "; color: var(--primary); font-size: 10px; }

        /* UI Elements */
        #loading-bar { height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); position: absolute; bottom: 0; left: 0; transition: width 0.5s cubic-bezier(0.1, 0.7, 1.0, 0.1); }
        
        #voice-anim { display: flex; align-items: center; gap: 4px; height: 30px; opacity: 0; }
        .v-bar { width: 4px; height: 8px; background: var(--primary); border-radius: 4px; transition: height 0.2s; }
        .playing .v-bar { animation: pulseNeural 0.7s infinite alternate; }

        @keyframes pulseNeural { from { height: 5px; opacity: 0.5; } to { height: 25px; opacity: 1; } }
        @keyframes neuralFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-neural {
            background: rgba(227, 6, 19, 0.1); border: 1px solid var(--primary);
            color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 10px;
            text-transform: uppercase; transition: 0.3s; margin-top: 15px;
        }
        .btn-neural:hover { background: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="scanline">

    <header class="h-16 border-b border-red-900/40 bg-black/80 flex items-center justify-between px-8 z-50">
        <div class="flex items-center gap-4">
            <div class="relative">
                <div class="w-4 h-4 bg-red-600 rounded-full animate-ping absolute"></div>
                <div class="w-4 h-4 bg-red-600 rounded-full relative shadow-[0_0_15px_#e30613]"></div>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] text-red-500 font-bold tracking-[0.4em]">SISTEMA NEURAL</span>
                <span class="text-xs font-bold uppercase tracking-widest">UNINTA <span class="text-red-600">UNTBOT_V5</span></span>
            </div>
        </div>
        
        <div id="voice-anim">
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>

        <div class="flex items-center gap-4">
            <div class="text-right hidden md:block">
                <div class="text-[9px] text-gray-500">COORDENAÇÃO: PROF. DAVI</div>
                <div class="text-[9px] text-gray-500">LAB: MATHEUS</div>
            </div>
            <div class="h-10 w-[1px] bg-red-900/30"></div>
            <div id="user-display" class="bg-red-950/20 px-4 py-2 rounded-lg border border-red-900/50 flex items-center gap-3">
                <span id="user-tag" class="text-[10px] text-red-400 font-bold tracking-tighter uppercase">SINCRONIZANDO...</span>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden p-4 gap-4">
        <aside class="w-64 hidden lg:flex flex-col gap-4">
            <div class="glass-card flex-1 p-4 overflow-y-auto no-scrollbar">
                <h3 class="text-[10px] font-bold text-red-600 mb-4 border-b border-red-900/30 pb-2">MÉTRICAS DO SISTEMA</h3>
                <div id="neural-metrics" class="space-y-4">
                    </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col gap-4 relative">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 h-52">
                <div class="glass-card md:col-span-1 flex flex-col items-center justify-center p-4 relative overflow-hidden">
                    <lottie-player src="Ai Robot Vector Art.json" background="transparent" speed="1" style="width: 110px; height: 110px;" loop autoplay></lottie-player>
                    <div class="absolute top-2 left-2 text-[8px] text-red-600 animate-pulse">LIVE_CORE</div>
                </div>
                <div id="brain-container" class="glass-card md:col-span-3 relative border border-red-900/20">
                    <div class="absolute bottom-2 right-4 text-[9px] text-red-900/60 font-bold">MONITORAMENTO CEREBRAL 3D</div>
                </div>
            </div>

            <div id="chat-display" class="flex-1 glass-card p-8 overflow-y-auto no-scrollbar space-y-6"></div>

            <div class="h-24 glass-card flex items-center px-8 gap-6 border-red-600/30 relative">
                <div class="flex-1 flex flex-col">
                    <span class="text-[8px] text-red-900 mb-1 font-bold">PROMPT_COMMAND_LINE:</span>
                    <input type="text" id="userInput" class="bg-transparent border-none outline-none text-red-100 text-sm w-full placeholder-red-900/50" placeholder="Digite sua dúvida clínica ou comando neural..." autocomplete="off">
                </div>
                <button id="btnEnviar" class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-md text-[10px] font-bold tracking-[0.2em] uppercase shadow-[0_0_20px_rgba(227,6,19,0.3)] transition-all active:scale-95">
                    PROCESSAR⚡
                </button>
                <div id="loading-bar" class="w-0"></div>
            </div>
        </main>
    </div>

    <script type="module">
        // --- CLASSE DE PROCESSAMENTO DE DADOS (EXPANSÃO) ---
        class NeuralProcessor {
            constructor() {
                this.startTime = Date.now();
                this.ops = 0;
            }

            async simulateAnalysis(query) {
                const metrics = document.getElementById('neural-metrics');
                const steps = ["Iniciando Sinapse", "Mapeando SciELO", "Consultando Wikipedia", "Limpando Ruído", "Gerando Mapa Mental"];
                
                metrics.innerHTML = "";
                for(let step of steps) {
                    const div = document.createElement('div');
                    div.className = "text-[9px] text-gray-400";
                    div.innerHTML = `<span class="text-red-600">●</span> ${step.toUpperCase()}...`;
                    metrics.appendChild(div);
                    await new Promise(r => setTimeout(r, 400));
                }
            }

            updateUptime() {
                const diff = Math.floor((Date.now() - this.startTime) / 1000);
                document.getElementById('neural-metrics').innerHTML += `<div class="mt-4 pt-4 border-t border-red-900/20 text-[9px] text-red-500">UPTIME: ${diff}s | OPS: ${Math.random().toFixed(2)}ms</div>`;
            }
        }
        window.Processor = new NeuralProcessor();
        // --- CONFIGURAÇÕES DE ACESSO ---
        const REDIS_URL = "https://enormous-raccoon-41416.upstash.io";
        const REDIS_TOKEN = "AaHIAAIncDIwNjZhOGMxNmYzMDQ0Mjc0YjYwMTJiNjI1NDYyNDg4ZHAyNDE0MTY";
        const GROQ_API_KEY = "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";

        const input = document.getElementById('userInput');
        const display = document.getElementById('chat-display');
        const userTag = document.getElementById('user-tag');
        const bar = document.getElementById('loading-bar');
        const voiceAnim = document.getElementById('voice-anim');
        const brainCont = document.getElementById('brain-container');
        
        let currentUserId = localStorage.getItem('untbot_last_id');
        let lastWikiData = { url: null, title: null };
        let lastScieloData = { url: null, title: null };

        // --- MOTOR DE BUSCA: SCIELO (ACADÊMICO) ---
        async function fetchScielo(query) {
            try {
                const res = await fetch(`https://search.scielo.org/api/v1/search?q=${encodeURIComponent(query)}&lang=pt&count=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    lastScieloData.url = data.results[0].url;
                    lastScieloData.title = data.results[0].title[0];
                    return `[ARTIGO SCIELO: ${lastScieloData.title}]`;
                }
                return "[Sem resultados no SciELO]";
            } catch (e) { return ""; }
        }

        // --- MOTOR DE BUSCA: WIKIPEDIA (CONCEITUAL) ---
        async function fetchWiki(query) {
            try {
                const cleanQuery = query.replace(/[?.,!]/g, '').trim();
                const res = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanQuery)}`);
                if (res.ok) {
                    const data = await res.json();
                    lastWikiData.url = data.content_urls?.desktop?.page;
                    lastWikiData.title = data.title;
                    return data.extract || "";
                }
                return "";
            } catch (e) { return ""; }
        }

        // --- EXPORTAÇÃO AVANÇADA PARA PDF ---
        function exportToPDF(content) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header Estilizado UNINTA
            doc.setFillColor(227, 6, 19);
            doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.text("LAUDO DE CONSULTA NEURAL - UNINTA", 15, 20);
            
            doc.setFontSize(9);
            doc.text(`ID: ${currentUserId.toUpperCase()} | DATA: ${new Date().toLocaleString()}`, 140, 20);

            // Conteúdo
            doc.setTextColor(40, 40, 40);
            doc.setFontSize(11);
            const splitText = doc.splitTextToSize(content.replace(/[*#]/g, ''), 180);
            doc.text(splitText, 15, 45);

            // Fontes de Verificação
            if(lastWikiData.url || lastScieloData.url) {
                doc.setDrawColor(200, 200, 200);
                doc.line(15, 270, 195, 270);
                doc.setFontSize(8);
                doc.text(`FONTES: Wikipedia (${lastWikiData.title || 'N/A'}) | SciELO (${lastScieloData.title || 'N/A'})`, 15, 275);
            }

            doc.save(`relatorio_neural_${currentUserId}.pdf`);
        }

        // --- MEMÓRIA REDIS ---
        async function saveChat(msg) { await fetch(`${REDIS_URL}/lpush/${currentUserId}/${encodeURIComponent(msg)}?_token=${REDIS_TOKEN}`); }
        async function loadHistory() { 
            try { 
                const r = await fetch(`${REDIS_URL}/lrange/${currentUserId}/0/5?_token=${REDIS_TOKEN}`); 
                const d = await r.json(); return d.result || []; 
            } catch(e) { return []; } 
        }

        // --- RENDERIZAÇÃO 3D (CORRIGIDA E EXPANDIDA) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, brainCont.clientWidth/brainCont.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(brainCont.clientWidth, brainCont.clientHeight);
        brainCont.appendChild(renderer.domElement);

        const brainGeo = new THREE.SphereGeometry(2, 32, 32);
        const brainMat = new THREE.MeshPhongMaterial({ 
            color: 0xe30613, wireframe: true, transparent: true, opacity: 0.3,
            emissive: 0xff0000, emissiveIntensity: 0.2
        });
        const brain = new THREE.Mesh(brainGeo, brainMat);
        scene.add(brain);

        const light1 = new THREE.PointLight(0xffffff, 1, 100); light1.position.set(10, 10, 10); scene.add(light1);
        const light2 = new THREE.AmbientLight(0x404040); scene.add(light2);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            brain.rotation.y += 0.005;
            brain.rotation.x += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // --- LÓGICA DE INTERAÇÃO ---
        async function processar() {
            const txt = input.value.trim();
            if(!txt) return;

            if(!currentUserId) {
                currentUserId = txt.toLowerCase();
                localStorage.setItem('untbot_last_id', currentUserId);
                userTag.innerText = currentUserId.toUpperCase();
                addMessageToUI('bot', `>> SINAPSE ESTABELECIDA. BEM-VINDO, ${currentUserId.toUpperCase()}.`);
                input.value = ""; return;
            }

            addMessageToUI('user', txt);
            bar.style.width = "100%";
            input.value = ""; input.disabled = true;

            try {
                // Execução paralela de buscas e histórico
                const [wiki, scielo, hist] = await Promise.all([fetchWiki(txt), fetchScielo(txt), loadHistory()]);
                
                const promptFinal = `
                    SISTEMA: UNTBOT NEURAL V5. 
                    CONTEXTO ACADÊMICO: Wiki(${wiki}) | SciELO(${scielo}).
                    DIRETRIZES: Resposta curta, direta, tom profissional clínico. 
                    REFERÊNCIAS: Cite UNINTA Tianguá e o Coordenador Prof. Davi se relevante.
                    HISTÓRICO RECENTE: ${hist.join(' | ')}
                `;

                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${GROQ_API_KEY}` },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "system", content: promptFinal }, { role: "user", content: txt }] })
                });

                const data = await res.json();
                const resp = data.choices[0].message.content;

                const botBubble = addMessageToUI('bot', "");
                await typeWriter(botBubble, resp);

                // Adicionar Verificação Visual
                if(lastWikiData.url || lastScieloData.url) {
                    const tag = document.createElement('div');
                    tag.className = "mt-4 p-2 bg-black/40 border-l-2 border-red-600 text-[9px] text-gray-400";
                    tag.innerHTML = `FONTES VERIFICADAS: ${lastWikiData.url ? `<a href="${lastWikiData.url}" target="_blank" class="text-red-500 underline">WIKIPEDIA</a>` : ''} | ${lastScieloData.url ? `<a href="${lastScieloData.url}" target="_blank" class="text-red-500 underline">SCIELO</a>` : ''}`;
                    botBubble.appendChild(tag);
                }

                // Botão de Download
                const btn = document.createElement('button');
                btn.className = "btn-neural"; btn.innerText = "BAIXAR RELATÓRIO PDF";
                btn.onclick = () => exportToPDF(resp);
                botBubble.appendChild(btn);

                await saveChat(`U: ${txt} | B: ${resp}`);
                window.Processor.updateUptime();

            } catch (e) {
                addMessageToUI('bot', ">> ERRO CRÍTICO NA TRANSMISSÃO NEURAL.");
            } finally {
                bar.style.width = "0%"; input.disabled = false; input.focus();
            }
        }

        // Auxiliares de UI
        function addMessageToUI(role, text) {
            const isBot = role === 'bot';
            const row = document.createElement('div');
            row.className = `msg-row ${isBot ? 'bot' : 'user'}`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isBot ? 'bot-bubble' : 'user-bubble'}`;
            bubble.innerHTML = text;
            row.innerHTML = `<div class="avatar-circle">${isBot ? '🤖' : '👤'}</div>`;
            row.appendChild(bubble);
            display.appendChild(row);
            display.scrollTop = display.scrollHeight;
            return bubble;
        }

        function typeWriter(elemento, texto) {
            return new Promise(resolve => {
                let i = 0; elemento.classList.add('typing');
                const interval = setInterval(() => {
                    if (i < texto.length) { 
                        elemento.innerHTML = marked.parse(texto.substring(0, i + 1)); 
                        i++; display.scrollTop = display.scrollHeight; 
                    } else { 
                        clearInterval(interval); elemento.classList.remove('typing'); 
                        if(window.MathJax) MathJax.typeset(); resolve(); 
                    }
                }, 10);
            });
        }

        document.getElementById('btnEnviar').onclick = processar;
        input.onkeypress = (e) => { if(e.key === 'Enter') processar(); };
        window.onload = () => { if(currentUserId) userTag.innerText = currentUserId.toUpperCase(); };
    </script>
</body>
</html>
