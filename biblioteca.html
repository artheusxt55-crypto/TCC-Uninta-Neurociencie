<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroLib - Biblioteca Digital</title>

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';
        connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://kczzuvkuubeqdokjihrm.supabase.co wss://kczzuvkuubeqdokjihrm.supabase.co;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net https://www.gstatic.com;
        img-src 'self' data: blob: https: https://*.googleusercontent.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        frame-src 'self' https://drive.google.com https://docs.google.com https://google.com https://*.google.com https://*.firebaseapp.com https://*.firebaseapp.com;
        worker-src 'self' blob:;
    ">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #e30613;
            --background: #030303;
            --sidebar: #0a0a0a;
            --card-bg: #0d0d0d;
        }

        body {
            background-color: var(--background);
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            background-color: var(--sidebar);
            border-right: 1px solid #1a1a1a;
        }

        .nav-button {
            transition: all 0.2s;
            color: #71717a;
            text-align: left;
        }

        .nav-button:hover {
            color: white;
            background: rgba(255,255,255,0.05);
        }

        .nav-button.active {
            background: rgba(227, 6, 19, 0.1);
            color: var(--primary);
            border-right: 3px solid var(--primary);
            border-radius: 0;
        }

        .header-glass {
            background: rgba(3, 3, 3, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1a1a1a;
        }

        .card-book {
            background: var(--card-bg);
            border: 1px solid #1a1a1a;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-book:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px -10px rgba(227, 6, 19, 0.2);
        }

        .modal-blur {
            backdrop-filter: blur(12px);
            background: rgba(0,0,0,0.85);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 10px;
        }

        .skeleton-pulse {
            background: linear-gradient(
                90deg,
                #0d0d0d 25%,
                #1a1a1a 50%,
                #0d0d0d 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>

<body class="flex h-screen overflow-hidden">

    <!-- MODAL PDF -->

    <div
        id="pdfModal"
        class="fixed inset-0 z-[100] hidden modal-blur p-4 md:p-8 flex flex-col"
    >
        <div class="flex justify-between items-center mb-4">

            <div>
                <h2
                    id="modalTitle"
                    class="text-xl font-bold truncate max-w-md"
                >
                    Visualizando Material
                </h2>

                <p
                    id="modalCategory"
                    class="text-xs text-red-500 font-bold uppercase tracking-widest"
                ></p>
            </div>

            <button
                onclick="closeModal()"
                class="p-2 hover:bg-white/10 rounded-full transition"
            >
                <i
                    data-lucide="x"
                    class="w-6 h-6"
                ></i>
            </button>

        </div>

        <div
            class="flex-1 bg-zinc-900 rounded-2xl overflow-hidden border border-white/5 relative"
        >

            <iframe
                id="pdfFrame"
                class="w-full h-full"
                src=""
                frameborder="0"
                allow="autoplay"
            ></iframe>

        </div>
    </div>


    <!-- SIDEBAR -->

    <aside class="sidebar w-64 flex flex-col hidden lg:flex">

        <div class="p-6 flex items-center gap-3">

            <div
                class="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center"
            >
                <i
                    data-lucide="brain"
                    class="text-white w-5 h-5"
                ></i>
            </div>

            <span class="font-bold text-xl tracking-tight">

            </span>

        </div>


        <nav class="flex-1 mt-4 space-y-1">

                class="px-6 py-2 text-[10px] font-bold text-zinc-600 uppercase tracking-widest"

            </p>


            <button

            </button>


            <button

            </button>


            <button
                onclick="filterCategory('TDAH')"

            >
                <i
                    data-lucide="focus"
                    class="w-4 h-4"
                ></i>

                TDAH
            </button>


            <button
                onclick="filterCategory('TEA')"
                class="nav-button w-full flex items-center gap-3 px-6 py-3 text-sm font-medium"
            >
                <i
                    data-lucide="users"

            </button>


            <button
                onclick="filterCategory('Psicofarmacologia')"
                class="nav-button w-full flex items-center gap-3 px-6 py-3 text-sm font-medium"
            >
                <i
                    data-lucide="pill"
                    class="w-4 h-4"
                ></i>

                Psicofarmacologia
            </button>

        </nav>


        <div class="p-6 border-t border-zinc-900">

            <p
                class="text-[9px] text-zinc-600 mb-4 font-bold text-center"
            >
                ASSISTENTE: UNT BOT
            </p>

            <a
                href="index.html"
                class="flex items-center gap-2 text-xs text-zinc-500 hover:text-white transition justify-center"
            >

                <i
                    data-lucide="arrow-left"
                    class="w-3 h-3"
                ></i>

                Voltar ao Lab

            </a>

        </div>

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="flex-1 flex flex-col overflow-hidden">

        <!-- HEADER -->

        <header
            class="header-glass px-8 py-4 flex items-center justify-between z-30"
        >

            <div class="flex-1 max-w-xl relative">

                <i
                    data-lucide="search"
                    class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"
                ></i>

                <input
                    type="text"
                    id="searchInput"
                    oninput="handleSearch()"

                >

            </div>


            <div class="flex items-center gap-4">

                <div
                    class="hidden sm:flex items-center gap-3 px-4 py-2 bg-zinc-900 rounded-xl border border-white/5"
                >

                    <div class="text-center">

                        <p
                            id="statTotal"
                            class="text-xs font-bold"
                        >
                            0
                        </p>

                        <p
                            class="text-[8px] text-zinc-500 uppercase font-bold"
                        >
                            Obras
                        </p>

                    </div>


                    <div class="w-px h-6 bg-zinc-800"></div>


                    <div
                        class="text-center cursor-pointer hover:opacity-70"
                        onclick="handleSearch('AVASUS')"
                    >

                        <p
                            id="statAvasus"

                        </p>

                        <p
                            class="text-[8px] text-zinc-500 uppercase font-bold"
                        >
                            AVASUS
                        </p>

                    </div>

                </div>


                <div
                    class="flex items-center gap-3 pl-4 border-l border-zinc-800"
                >

                    <div
                        class="text-right leading-none hidden md:block"
                    >

                        <p
                            class="text-xs font-bold"
                        >
                            Mestre Matheus
                        </p>

                        <p
                            class="text-[9px] text-zinc-500 font-medium"
                        >
                            Uninta Tianguá
                        </p>

                    </div>


                    <div
                        class="w-10 h-10 rounded-full border border-zinc-800 flex items-center justify-center bg-zinc-900"
                    >

                        <i

                            class="w-5 h-5 text-zinc-400"

                    </div>

                </div>

            </div>

        </header>


        <!-- BIBLIOTECA -->

        <div class="flex-1 overflow-y-auto p-8">

            <div class="mb-10 flex justify-between items-end">

                <div>

                    <h1
                        class="text-3xl font-bold tracking-tight"
                    >
                        Acervo Digital
                    </h1>

                    <p
                        class="text-zinc-500 text-sm mt-1"

                        Carregando dados do servidor...
                    </p>

                </div>

            </div>


            <div
                class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6"
                id="bookGrid"
            ></div>

        </div>

    </main>


    <!-- FIREBASE + FIRESTORE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        /*
        ============================================================
        CONFIGURAÇÃO DO FIREBASE
        ============================================================
        */

        const firebaseConfig = {

            apiKey: "COLOQUE_SUA_API_KEY_AQUI",

            authDomain: "educacube.firebaseapp.com",

            projectId: "educacube",

            storageBucket: "educacube.firebasestorage.app",

            messagingSenderId: "COLOQUE_SEU_MESSAGING_SENDER_ID_AQUI",

            appId: "COLOQUE_SEU_APP_ID_AQUI"

        };


        /*
        ============================================================
        INICIALIZA FIREBASE
        ============================================================
        */

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        /*
        ============================================================
        ESTADO DA BIBLIOTECA
        ============================================================
        */

        let allBooks = [];

        let currentCategory = "Todos";

        let searchTerm = "";


        let favorites = JSON.parse(
            localStorage.getItem("neurolib_favorites") || "[]"
        );


        /*
        ============================================================
        CORES DOS BADGES
        ============================================================
        */

        const badgeColors = {

            "USP":
                "bg-blue-500/20 text-blue-400",

            "CBI":
                "bg-purple-500/20 text-purple-400",

            "AVASUS":
                "bg-green-500/20 text-green-400",

            "UFRGS":
                "bg-orange-500/20 text-orange-400",

            "Padrao":
                "bg-red-500/20 text-red-400"

        };


        /*
        ============================================================
        SKELETON
        ============================================================
        */

        function renderSkeletons() {

            const grid =
                document.getElementById("bookGrid");


            grid.innerHTML = Array(8).fill(`

                <div
                    class="card-book rounded-2xl overflow-hidden flex flex-col h-[320px]"
                >

                    <div
                        class="skeleton-pulse h-40 w-full"
                    ></div>

                    <div
                        class="p-5 space-y-3 flex-1"
                    >

                        <div
                            class="skeleton-pulse h-3 w-1/4"
                        ></div>

                        <div
                            class="skeleton-pulse h-5 w-3/4"
                        ></div>

                        <div
                            class="skeleton-pulse h-3 w-1/2"
                        ></div>

                        <div
                            class="skeleton-pulse h-10 w-full mt-4 rounded-xl"
                        ></div>

                    </div>

                </div>

            `).join("");

        }


        /*
        ============================================================
        BUSCAR LIVROS NO FIRESTORE
        ============================================================
        */

        async function fetchBooks() {

            renderSkeletons();


            try {

                console.log(
                    "📚 Buscando biblioteca no Firestore..."
                );


                const bibliotecaRef =
                    collection(
                        db,
                        "biblioteca"
                    );


                const snapshot =
                    await getDocs(
                        bibliotecaRef
                    );


                allBooks = snapshot.docs.map(
                    (doc) => {

                        return {

                            id: doc.id,

                            ...doc.data()

                        };

                    }
                );


                console.log(
                    "✅ Biblioteca carregada:",
                    allBooks.length,
                    "materiais"
                );


                updateStats();


                setTimeout(
                    renderBooks,
                    600
                );


            } catch (err) {

                console.error(
                    "❌ Erro ao carregar biblioteca:",
                    err
                );


                document.getElementById(
                    "bookCount"
                ).innerText =
                    "Erro ao conectar com o banco.";


                document.getElementById(
                    "bookGrid"
                ).innerHTML = `

                    <div class="col-span-full text-center py-20">

                        <div
                            class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-red-600/10 mb-4"
                        >

                            <i
                                data-lucide="database-zap"
                                class="w-7 h-7 text-red-500"
                            ></i>

                        </div>

                        <p
                            class="text-red-500 font-bold mb-2"
                        >
                            Não foi possível carregar a biblioteca.
                        </p>

                        <p
                            class="text-zinc-600 text-sm"
                        >
                            Verifique as configurações e as regras do Firestore.
                        </p>

                    </div>

                `;


                lucide.createIcons();

            }

        }


        /*
        ============================================================
        ESTATÍSTICAS
        ============================================================
        */

        function updateStats() {

            document.getElementById(
                "statTotal"
            ).innerText =
                allBooks.length;


            document.getElementById(
                "statAvasus"
            ).innerText =
                allBooks.filter(
                    book =>
                        (book.autor || "")
                            .toUpperCase()
                            .includes("AVASUS")
                ).length;

        }


        /*
        ============================================================
        FAVORITOS
        ============================================================
        */

        window.toggleFavorite =
            function(id, e) {

                e.stopPropagation();


                const idString =
                    String(id);


                const index =
                    favorites.indexOf(
                        idString
                    );


                if (index > -1) {

                    favorites.splice(
                        index,
                        1
                    );

                } else {

                    favorites.push(
                        idString
                    );

                }


                localStorage.setItem(
                    "neurolib_favorites",
                    JSON.stringify(
                        favorites
                    )
                );


                renderBooks();

            };


        /*
        ============================================================
        ABRIR PDF
        ============================================================
        */

        window.openModal =
            function(
                url,
                titulo,
                categoria
            ) {

                const modal =
                    document.getElementById(
                        "pdfModal"
                    );


                const frame =
                    document.getElementById(
                        "pdfFrame"
                    );


                document.getElementById(
                    "modalTitle"
                ).innerText =
                    titulo || "Visualizando Material";


                document.getElementById(
                    "modalCategory"
                ).innerText =
                    categoria || "Material";


                let viewUrl = url;


                if (
                    url &&
                    url.includes(
                        "drive.google.com"
                    )
                ) {

                    const fileId =
                        url.match(
                            /[-\w]{25,}/
                        );


                    if (fileId) {

                        viewUrl =
                            `https://drive.google.com/file/d/${fileId[0]}/preview`;

                    }

                } else if (url) {

                    viewUrl =
                        url
                            .replace(
                                "export=download",
                                "view"
                            )
                            .replace(
                                "export=view",
                                "view"
                            );

                }


                if (!viewUrl) {

                    alert(
                        "Este material não possui um endereço PDF válido."
                    );

                    return;

                }


                frame.src =
                    viewUrl;


                modal.classList.remove(
                    "hidden"
                );

            };


        /*
        ============================================================
        FECHAR MODAL
        ============================================================
        */

        window.closeModal =
            function() {

                document.getElementById(
                    "pdfModal"
                ).classList.add(
                    "hidden"
                );


                document.getElementById(
                    "pdfFrame"
                ).src = "";

            };


        /*
        ============================================================
        RENDERIZAR LIVROS
        ============================================================
        */

        function renderBooks() {

            const grid =
                document.getElementById(
                    "bookGrid"
                );


            const filtered =
                allBooks.filter(
                    book => {

                        const isFav =
                            currentCategory === "Favoritos"
                                ? favorites.includes(
                                    String(book.id)
                                )
                                : true;


                        const matchesCat =
                            currentCategory === "Todos" ||
                            currentCategory === "Favoritos" ||
                            book.categoria ===
                                currentCategory;


                        const titulo =
                            (
                                book.titulo || ""
                            ).toLowerCase();


                        const autor =
                            (
                                book.autor || ""
                            ).toLowerCase();


                        const matchesSearch =
                            titulo.includes(
                                searchTerm.toLowerCase()
                            ) ||
                            autor.includes(
                                searchTerm.toLowerCase()
                            );


                        return (
                            isFav &&
                            matchesCat &&
                            matchesSearch
                        );

                    }
                );


            if (
                filtered.length === 0
            ) {

                grid.innerHTML = `

                    <p
                        class="text-zinc-500 col-span-full text-center py-20"
                    >
                        Nenhum material encontrado.
                    </p>

                `;

            } else {

                grid.innerHTML =
                    filtered.map(
                        book => {

                            const isFav =
                                favorites.includes(
                                    String(book.id)
                                );


                            let badgeClass =
                                badgeColors.Padrao;


                            let fonteNome =
                                "NeuroLib";


                            const autorStr =
                                book.autor || "";


                            if (
                                autorStr.includes(
                                    "USP"
                                )
                            ) {

                                badgeClass =
                                    badgeColors.USP;

                                fonteNome =
                                    "USP";

                            } else if (
                                autorStr.includes(
                                    "AVASUS"
                                )
                            ) {

                                badgeClass =
                                    badgeColors.AVASUS;

                                fonteNome =
                                    "AVASUS";

                            } else if (
                                autorStr.includes(
                                    "CBI"
                                )
                            ) {

                                badgeClass =
                                    badgeColors.CBI;

                                fonteNome =
                                    "CBI";

                            } else if (
                                autorStr.includes(
                                    "UFRGS"
                                )
                            ) {

                                badgeClass =
                                    badgeColors.UFRGS;

                                fonteNome =
                                    "UFRGS";

                            }


                            const titulo =
                                escapeHtml(
                                    book.titulo ||
                                    "Material sem título"
                                );


                            const autor =
                                escapeHtml(
                                    book.autor ||
                                    "Autor do Acervo"
                                );


                            const categoria =
                                escapeHtml(
                                    book.categoria ||
                                    "Geral"
                                );


                            const urlPdf =
                                escapeHtmlAttribute(
                                    book.url_pdf ||
                                    ""
                                );


                            const capa =
                                escapeHtmlAttribute(
                                    book.capa ||
                                    "https://images.unsplash.com/photo-1559757175-5700dde675bc?q=80&w=1000"
                                );


                            return `

                                <div
                                    class="card-book rounded-2xl overflow-hidden flex flex-col h-full group relative"
                                >

                                    <button
                                        onclick="toggleFavorite('${escapeJs(String(book.id))}', event)"
                                        class="absolute top-3 left-3 z-20 p-2 rounded-full bg-black/50 hover:bg-black/80 transition backdrop-blur-sm"
                                    >

                                        <i
                                            data-lucide="heart"
                                            class="w-4 h-4 ${
                                                isFav
                                                    ? "fill-red-500 text-red-500"
                                                    : "text-white"
                                            }"
                                        ></i>

                                    </button>


                                    <span
                                        class="absolute top-3 right-3 z-10 text-[10px] font-bold px-2 py-1 rounded-md ${badgeClass} border border-white/5"
                                    >
                                        ${fonteNome}
                                    </span>


                                    <div
                                        class="relative h-44 overflow-hidden cursor-pointer"
                                        onclick="openModal(
                                            '${escapeJs(book.url_pdf || "")}',
                                            '${escapeJs(book.titulo || "Material")}',
                                            '${escapeJs(book.categoria || "Geral")}'
                                        )"
                                    >

                                        <img
                                            src="${capa}"
                                            class="w-full h-full object-cover opacity-60 group-hover:scale-110 transition-transform duration-500"
                                            onerror="this.src='https://images.unsplash.com/photo-1559757175-5700dde675bc?q=80&w=1000'"
                                        >


                                        <div
                                            class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300"
                                        >

                                            <div
                                                class="bg-red-600 p-3 rounded-full shadow-lg transform translate-y-4 group-hover:translate-y-0 transition"
                                            >

                                                <i
                                                    data-lucide="play"
                                                    class="w-5 h-5 text-white fill-white"
                                                ></i>

                                            </div>

                                        </div>

                                    </div>


                                    <div
                                        class="p-5 flex flex-col flex-1"
                                    >

                                        <span
                                            class="text-[9px] uppercase font-black text-red-500 tracking-widest mb-1"
                                        >
                                            ${categoria}
                                        </span>


                                        <h3
                                            class="font-bold text-zinc-100 text-sm leading-tight mb-1 line-clamp-2 group-hover:text-red-500 transition-colors cursor-pointer"
                                            onclick="openModal(
                                                '${escapeJs(book.url_pdf || "")}',
                                                '${escapeJs(book.titulo || "Material")}',
                                                '${escapeJs(book.categoria || "Geral")}'
                                            )"
                                        >
                                            ${titulo}
                                        </h3>


                                        <p
                                            class="text-zinc-500 text-[11px] mb-4"
                                        >
                                            ${autor}
                                        </p>


                                        <div
                                            class="mt-auto flex gap-2"
                                        >

                                            <button
                                                onclick="openModal(
                                                    '${escapeJs(book.url_pdf || "")}',
                                                    '${escapeJs(book.titulo || "Material")}',
                                                    '${escapeJs(book.categoria || "Geral")}'
                                                )"
                                                class="flex-1 flex items-center justify-center gap-2 bg-zinc-800 hover:bg-zinc-700 text-white py-2 rounded-xl text-[10px] font-bold transition-all active:scale-95"
                                            >

                                                <i
                                                    data-lucide="eye"
                                                    class="w-3.5 h-3.5"
                                                ></i>

                                                LER AGORA

                                            </button>


                                            <a
                                                href="${urlPdf}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                class="flex items-center justify-center bg-white text-black hover:bg-red-600 hover:text-white px-4 py-2 rounded-xl transition-all active:scale-95 shadow-lg"
                                            >

                                                <i
                                                    data-lucide="download"
                                                    class="w-4 h-4"
                                                ></i>

                                            </a>

                                        </div>

                                    </div>

                                </div>

                            `;

                        }
                    ).join("");

            }


            document.getElementById(
                "bookCount"
            ).innerText =
                `${filtered.length} Materiais Disponíveis`;


            lucide.createIcons();

        }


        /*
        ============================================================
        FILTRO DE CATEGORIA
        ============================================================
        */

        window.filterCategory =
            function(cat) {

                currentCategory =
                    cat;


                document
                    .querySelectorAll(
                        ".nav-button"
                    )
                    .forEach(
                        btn => {

                            btn.classList.remove(
                                "active"
                            );


                            if (
                                btn.innerText
                                    .trim()
                                    .includes(cat)
                            ) {

                                btn.classList.add(
                                    "active"
                                );

                            }

                        }
                    );


                renderBooks();

            };


        /*
        ============================================================
        PESQUISA
        ============================================================
        */

        window.handleSearch =
            function(
                preset = ""
            ) {

                if (preset) {

                    document.getElementById(
                        "searchInput"
                    ).value =
                        preset;


                    searchTerm =
                        preset;

                } else {

                    searchTerm =
                        document.getElementById(
                            "searchInput"
                        ).value;

                }


                renderBooks();

            };


        /*
        ============================================================
        PROTEÇÃO CONTRA HTML INJETADO
        ============================================================
        */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function escapeHtmlAttribute(value) {

            return escapeHtml(
                value
            );

        }


        function escapeJs(value) {

            return String(value)
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /'/g,
                    "\\'"
                )
                .replace(
                    /"/g,
                    '\\"'
                )
                .replace(
                    /\n/g,
                    "\\n"
                )
                .replace(
                    /\r/g,
                    "\\r"
                );

        }


        /*
        ============================================================
        FECHAR MODAL COM ESC
        ============================================================
        */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeModal();

                }

            }
        );


        /*
        ============================================================
        INICIAR
        ============================================================
        */

        lucide.createIcons();

        fetchBooks();

    </script>

</body>
</html>
