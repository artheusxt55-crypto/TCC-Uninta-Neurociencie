<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas de Neurociência Interativo | TCC Uninta</title>
    <style>
        :root {
            --vermelho-medico: #b30000;
            --preto-profundo: #050505;
            --cinza-escuro: #121212;
            --texto-claro: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--preto-profundo);
            color: var(--texto-claro);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--cinza-escuro);
            border-bottom: 2px solid var(--vermelho-medico);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* --- BLINDAGEM DE INTERAÇÃO (PARA MATAR O POP-UP) --- */
        .atlas-section {
            flex: 2;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        /* Camada invisível que bloqueia o disparo do script de pop-up */
        .interaction-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        .atlas-wrapper {
            position: absolute;
            top: -70px;      /* Esconde Sign-up e barra superior */
            left: -45px;     /* Esconde controles laterais */
            width: calc(100% + 90px);
            height: calc(100% + 140px); /* Esconde marca d'água inferior */
            pointer-events: none; /* Desativa a detecção de cliques no iframe */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0; /* Começa oculto para esconder o carregamento da logo */
            transition: opacity 1s ease-in;
        }
        /* ---------------------------------------------------- */

        .info-sidebar {
            flex: 0 0 350px;
            background-color: var(--cinza-escuro);
            padding: 25px;
            overflow-y: auto;
            border-left: 1px solid #222;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            z-index: 90;
        }

        .card {
            background-color: #1a1a1a;
            border-left: 4px solid var(--vermelho-medico);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        h2 { color: var(--vermelho-medico); margin-top: 0; font-size: 1.2rem; }
        h3 { font-size: 1rem; margin-bottom: 8px; color: #fff; }
        
        .btn-ia {
            background-color: var(--vermelho-medico);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-ia:hover { background-color: #ff1a1a; transform: translateY(-2px); }

        .btn-voltar {
            color: var(--texto-claro);
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
        }

        footer {
            background: var(--cinza-escuro);
            font-size: 0.75rem;
            text-align: center;
            padding: 8px;
            border-top: 1px solid #222;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center; gap: 20px;">
        <h1 style="margin:0; font-size: 1.3rem; color: var(--vermelho-medico); letter-spacing: 1px;">NEURO-MAPPER 3D</h1>
        <span style="font-size: 0.8rem; opacity: 0.5; border-left: 1px solid #444; padding-left: 15px;">Mapeamento Cortical</span>
    </div>
    <a href="index.html" class="btn-voltar">← VOLTAR AO PAINEL</a>
</header>

<div class="main-container">
    <section class="atlas-section">
        <div class="interaction-shield"></div>
        
        <div id="atlas-anchor" class="atlas-wrapper">
