<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Mapper 3D | UNINTA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff3333;
            --bg-deep: #0f0000;
        }

        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: var(--bg-deep); font-family: 'Rajdhani', sans-serif; color: white; }

        /* Fundo de Partículas Estiloso */
        #particles-js { position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        header {
            position: relative; z-index: 100; padding: 15px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.85); border-bottom: 2px solid var(--neon-red);
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }

        .main-container { display: flex; height: calc(100vh - 75px); position: relative; z-index: 10; }
        
        /* Área do Visualizador 3D */
        #canvas-container { 
            flex: 2; position: relative; 
            background: radial-gradient(circle, #2a0000 0%, #050000 100%); 
        }

        /* Sidebar Glassmorphism */
        .sidebar {
            width: 350px; background: rgba(5, 0, 0, 0.95); backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 51, 51, 0.3); padding: 25px; overflow-y: auto;
        }

        h2 { font-family: 'Orbitron'; font-size: 0.9rem; color: var(--neon-red); margin-bottom: 20px; letter-spacing: 2px; }

        .card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,51,51,0.1);
            padding: 18px; margin-bottom: 12px; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .card:hover, .card.active { background: rgba(255,51,51,0.2); border-color: var(--neon-red); transform: translateX(5px); }

        /* Label 3D (A caixa que aparece no cérebro) */
        #brain-label {
            position: absolute; background: var(--neon-red); color: white;
            padding: 10px 18px; border-radius: 5px; font-family: 'Orbitron';
            font-size: 11px; font-weight: bold; border: 2px solid white;
            display: none; z-index: 1000; pointer-events: none;
            transform: translate(-50%, -120%); box-shadow: 0 0 15px var(--neon-red);
        }
        #brain-label::after {
            content: ''; position: absolute; bottom: -10px; left: 50%;
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-top: 10px solid white; transform: translateX(-50%);
        }

        #loader { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-family: 'Orbitron'; color: var(--neon-red); font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div id="particles-js"></div>
<div id="brain-label">DETALHE DA ÁREA</div>

<header>
    <div style="font-family: 'Orbitron'; letter-spacing: 3px;">NEURO-SCAN <span style="color:var(--neon-red)">3D</span></div>
    <div style="font-family: 'Orbitron'; font-size: 11px; color: var(--neon-red)">UNINTA TIANGUÁ</div>
</header>

<div class="main-container">
    <section id="canvas-container">
        <div id="loader">A INICIALIZAR SCANNER...</div>
    </section>

    <aside class="sidebar">
        <h2>ÁREAS CLÍNICAS</h2>
        
        <div class="card" onclick="focusArea('Frontal', 'CÓRTEX PRÉ-FRONTAL')">
            <strong>Lobo Frontal</strong>
            <p style="font-size: 12px; color: #aaa;">Foco: Funções Executivas e TDAH.</p>
        </div>

        <div class="card" onclick="focusArea('Temporal', 'LOBO TEMPORAL')">
            <strong>Lobo Temporal</strong>
            <p style="font-size: 12px; color: #aaa;">Foco: Linguagem, TEA e Memória.</p>
        </div>

        <div class="card" onclick="focusArea('Occipital', 'LOBO OCCIPITAL')">
            <strong>Lobo Occipital</strong>
            <p style="font-size: 12px; color: #aaa;">Foco: Processamento Visual.</p>
        </div>

        <div class="card" onclick="focusArea('Cerebelo', 'CEREBELO')">
            <strong>Cerebelo</strong>
            <p style="font-size: 12px; color: #aaa;">Foco: Coordenação e Equilíbrio.</p>
        </div>

        <div class="card" onclick="focusArea('Reset', '')" style="margin-top: 30px; border-color: white;">
            <center><strong style="color: var(--neon-red)">VISÃO GERAL</strong></center>
        </div>
    </aside>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/",
      "gsap": "https://cdn.skypack.dev/gsap"
    }
  }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import gsap from 'gsap';

    let scene, camera, renderer, controls, brain;
    let label = document.getElementById('brain-label');
    let labelPos3D = new THREE.Vector3();

    const pontos = {
        "Frontal": { x: 0, y: 1.5, z: 3.5, target: new THREE.Vector3(0, 0.8, 0.5) },
        "Temporal": { x: 3.5, y: 0, z: 1, target: new THREE.Vector3(1.2, 0, 0) },
        "Occipital": { x: 0, y: 0.5, z: -3.5, target: new THREE.Vector3(0, 0.1, -1.2) },
        "Cerebelo": { x: 0, y: -2, z: -2.5, target: new THREE.Vector3(0, -1, -0.8) },
        "Reset": { x: 4, y: 2, z: 6, target: new THREE.Vector3(0, 0, 0) }
    };

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        
        // FOV de 45 e Near de 0.01 para não "cortar" o modelo
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 1000);
        camera.position.set(4, 2, 6);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Iluminação de Estúdio (Essencial para visibilidade)
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const pointLight = new THREE.PointLight(0xffffff, 1.5);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        const loader = new GLTFLoader();
        loader.load('./brain_areas.glb', (gltf) => {
            brain = gltf.scene;

            // --- LÓGICA DE ESCALA E CENTRALIZAÇÃO ---
            const box = new THREE.Box3().setFromObject(brain);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // Escala para garantir que o cérebro tenha sempre 3 unidades de tamanho
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 3.5 / maxDim;
            brain.scale.set(scale, scale, scale);

            // Move o modelo para o centro (0,0,0) corrigindo o pivot original
            brain.position.x = -center.x * scale;
            brain.position.y = -center.y * scale;
            brain.position.z = -center.z * scale;

            brain.traverse(n => {
                if (n.isMesh) {
                    n.material = new THREE.MeshStandardMaterial({
                        color: 0xff3333,
                        metalness: 0.6,
                        roughness: 0.2,
                        emissive: 0x440000,
                        emissiveIntensity: 0.5
                    });
                }
            });

            scene.add(brain);
            document.getElementById('loader').style.display = 'none';
            
        }, undefined, (error) => {
            document.getElementById('loader').innerText = "Erro ao carregar ficheiro!";
        });

        animate();
    }

    window.focusArea = function(id, text) {
        const p = pontos[id];
        if (!p || !brain) return;

        controls.autoRotate = false;
        
        // Transição suave da câmara
        gsap.to(camera.position, { x: p.x, y: p.y, z: p.z, duration: 2, ease: "power3.inOut" });
        gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 2 });

        if (id === "Reset") {
            label.style.display = 'none';
            controls.autoRotate = true;
        } else {
            label.innerText = text;
            label.style.display = 'block';
            labelPos3D.copy(p.target);
        }
    };

    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // Faz a etiqueta 2D seguir o ponto 3D na tela
        if (label.style.display === 'block') {
            const vector = labelPos3D.clone().project(camera);
            const container = document.getElementById('canvas-container');
            const x = (vector.x * 0.5 + 0.5) * container.clientWidth;
            const y = (vector.y * -0.5 + 0.5) * container.clientHeight;
            label.style.left = `${x}px`;
            label.style.top = `${y}px`;
        }

        renderer.render(scene, camera);
    }

    init();

    // Partículas de fundo (Rede Neuronal)
    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 50 },
            "color": { "value": "#ff0000" },
            "line_linked": { "enable": true, "distance": 150, "color": "#ff0000", "opacity": 0.2 },
            "move": { "enable": true, "speed": 1 }
        }
    });
</script>
</body>
</html>
