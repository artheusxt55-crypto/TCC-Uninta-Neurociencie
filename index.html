
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <!-- Título da página -->
    <title>EducaCube — Plataforma Educacional com Inteligência Artificial</title>

    <!-- Descrição para mecanismos de busca -->
    <meta
        name="description"
        content="EducaCube é uma plataforma educacional que reúne recursos de aprendizagem, tecnologia e inteligência artificial para estudantes e educadores."
    />

    <!-- Permite que o Google indexe a página -->
    <meta
        name="robots"
        content="index, follow"
    />

    <!-- URL principal do site -->
    <link
        rel="canonical"
        href="https://educacube.online/"
    />

    <!-- Dados estruturados para ajudar o Google a entender o EducaCube -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EducaCube",
        "url": "https://educacube.online/",
        "description": "Plataforma educacional que reúne recursos de aprendizagem, tecnologia e inteligência artificial para estudantes e educadores."
    }
    </script>
</head>

<body>
    <div id="root"></div>

    <script
        type="module"
        src="/src/main.tsx"
    ></script>
</body>
