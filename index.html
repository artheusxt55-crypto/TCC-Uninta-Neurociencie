
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratório de Aprendizagem — Neuro-UNINTA</title>

    <script type="module"
        src="https://unpkg.com/@splinetool/viewer@1.9.59/build/spline-viewer.js">
    </script>

    <style>
        :root {
            --primary: #4f7cff;
            --secondary: #7c5cff;
            --accent: #00d4ff;
            --success: #35d07f;
            --bg: #06101f;
            --card: rgba(10, 20, 38, 0.88);
            --text: #eaf2ff;
            --muted: #8c9ab3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 70% 40%, rgba(79,124,255,0.15), transparent 35%),
                radial-gradient(circle at 20% 80%, rgba(124,92,255,0.12), transparent 35%),
                linear-gradient(135deg, #06101f, #02050b);

            color: var(--text);
            font-family: Inter, Arial, sans-serif;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* =========================
           BOTÃO ÁREA DO ALUNO
        ========================== */

        .btn-aluno-fixo {
            position: fixed;
            top: 20px;
            right: 20px;

            width: auto;
            padding: 12px 24px;

            background: rgba(79,124,255,0.15);
            border: 1px solid rgba(79,124,255,0.5);

            color: white;
            border-radius: 12px;

            font-size: 11px;
            font-weight: 800;

            text-decoration: none;
            letter-spacing: .5px;

            backdrop-filter: blur(10px);

            z-index: 100;

            transition: .3s;
        }

        .btn-aluno-fixo:hover {
            background: var(--primary);
            box-shadow: 0 0 25px rgba(79,124,255,.4);
            transform: translateY(-2px);
        }

        /* =========================
           CONTAINER
        ========================== */

        .main-container {
            display: flex;

            width: 95%;
            max-width: 1250px;

            gap: 45px;

            align-items: center;
            justify-content: center;

            z-index: 10;
        }

        /* =========================
           CARD PRINCIPAL
        ========================== */

        .card {
            width: 400px;

            padding: 30px;

            background: var(--card);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 28px;

            text-align: center;

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0,0,0,.55),
                inset 0 1px rgba(255,255,255,.05);
        }

        /* =========================
           CABEÇALHO
        ========================== */

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-bottom: 18px;
        }

        .brand-icon {
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

            font-size: 15px;

            box-shadow: 0 0 20px rgba(79,124,255,.3);
        }

        .brand span {
            font-size: 10px;
            font-weight: 800;

            letter-spacing: 1.5px;

            color: #aebbd1;
        }

        /* =========================
           PAINEL PEDAGÓGICO
        ========================== */

        .learning-panel {
            margin-bottom: 15px;

            padding: 14px;

            background: rgba(255,255,255,.025);

            border: 1px solid rgba(255,255,255,.06);

            border-radius: 17px;
        }

        .panel-title {
            font-size: 9px;

            font-weight: 800;

            color: var(--accent);

            letter-spacing: 1.5px;

            margin-bottom: 10px;
        }

        .learning-grid {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 6px;
        }

        .learning-btn {
            border: 1px solid rgba(255,255,255,.06);

            background: rgba(255,255,255,.04);

            color: #b7c2d4;

            border-radius: 9px;

            padding: 9px 3px;

            font-size: 8px;

            font-weight: 800;

            cursor: pointer;

            transition: .25s;
        }

        .learning-btn:hover,
        .learning-btn.active {
            background: rgba(79,124,255,.18);

            border-color: rgba(79,124,255,.5);

            color: white;

            transform: translateY(-2px);
        }

        .learning-icon {
            display: block;

            font-size: 16px;

            margin-bottom: 4px;
        }

        #status-label {
            font-size: 7px;

            margin-top: 10px;

            color: #71809a;

            text-transform: uppercase;

            letter-spacing: .5px;
        }

        /* =========================
           ROBÔ SPLINE
        ========================== */

        .avatar-3d {
            width: 100%;
            height: 160px;

            margin-bottom: 5px;

            border-radius: 20px;

            overflow: hidden;
        }

        /* =========================
           TEXTOS
        ========================== */

        h2 {
            font-size: 23px;

            margin-bottom: 5px;

            letter-spacing: -.5px;
        }

        .subtitle {
            color: var(--muted);

            margin-bottom: 20px;

            font-size: 11px;

            line-height: 1.5;
        }

        /* =========================
           INPUT
        ========================== */

        input {
            width: 100%;

            padding: 15px;

            background: rgba(255,255,255,.045);

            border: 1px solid rgba(255,255,255,.1);

            border-radius: 11px;

            color: white;

            margin-bottom: 12px;

            text-align: center;

            outline: none;

            font-size: 14px;

            transition: .3s;
        }

        input:focus {
            border-color: rgba(79,124,255,.7);

            box-shadow: 0 0 20px rgba(79,124,255,.1);
        }

        /* =========================
           BOTÕES
        ========================== */

        .btn-neuro {
            display: block;

            width: 100%;

            padding: 17px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );

            color: white;

            border: none;

            border-radius: 12px;

            font-weight: 800;

            text-transform: uppercase;

            text-decoration: none;

            cursor: pointer;

            transition: .3s;

            font-size: 12px;

            letter-spacing: .4px;
        }

        .btn-neuro:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(79,124,255,.25);
        }

        .btn-library {
            margin-top: 10px;

            background: transparent;

            border: 1px solid rgba(255,255,255,.12);

            font-size: 11px;

            padding: 14px;
        }

        .btn-library:hover {
            background: rgba(255,255,255,.04);
        }

        .btn-atlas {
            display: block;

            width: 100%;

            padding: 13px;

            background: rgba(0,212,255,.04);

            color: #b9ecff;

            border: 1px solid rgba(0,212,255,.25);

            border-radius: 12px;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition: .3s;

            margin-top: 10px;

            font-size: 10px;

            letter-spacing: .5px;
        }

        .btn-atlas:hover {
            background: rgba(0,212,255,.1);

            transform: translateY(-2px);
        }

        /* =========================
           QR
        ========================== */

        .qr-section img {
            width: 62px;

            border-radius: 8px;

            margin-top: 14px;

            opacity: .8;
        }

        .qr-section p {
            font-size: 8px;

            color: #526078;

            margin-top: 5px;
        }

        /* =========================
           CÉREBRO 3D
        ========================== */

        #brain-viewport {
            flex: 1;

            height: 600px;

            min-width: 500px;

            position: relative;
        }

        .brain-label {
            position: absolute;

            top: 35px;
            left: 50%;

            transform: translateX(-50%);

            padding: 8px 14px;

            background: rgba(6,16,31,.65);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 20px;

            backdrop-filter: blur(10px);

            font-size: 9px;

            color: #91a1ba;

            letter-spacing: 1px;

            z-index: 5;

            white-space: nowrap;
        }

        .brain-label strong {
            color: #dce8ff;
        }

        /* =========================
           RESPONSIVIDADE
        ========================== */

        @media (max-width: 900px) {

            body {
                overflow: auto;

                padding: 80px 0 30px;
            }

            .main-container {
                flex-direction: column;
            }

            #brain-viewport {
                width: 100%;

                min-width: 0;

                height: 420px;

                order: -1;
            }

            .card {
                width: min(400px, 92%);
            }
        }
    </style>
</head>

<body>

    <a href="aluno.html" class="btn-aluno-fixo">
        ÁREA DO ALUNO
    </a>

    <div class="main-container">

        <!-- =========================
             CARD
        ========================== -->

        <div class="card">

            <div class="brand">
                <div class="brand-icon">🧠</div>
                <span>NEURO-EDUCA • UNINTA</span>
            </div>

            <!-- PAINEL PEDAGÓGICO -->

            <div class="learning-panel">

                <div class="panel-title">
                    LABORATÓRIO DE APRENDIZAGEM
                </div>

                <div class="learning-grid">

                    <button
                        class="learning-btn active"
                        onclick="selecionarModulo('ATENÇÃO', this)">
                        <span class="learning-icon">🎯</span>
                        ATENÇÃO
                    </button>

                    <button
                        class="learning-btn"
                        onclick="selecionarModulo('MEMÓRIA', this)">
                        <span class="learning-icon">🧠</span>
                        MEMÓRIA
                    </button>

                    <button
                        class="learning-btn"
                        onclick="selecionarModulo('RACIOCÍNIO', this)">
                        <span class="learning-icon">🔎</span>
                        RACIOCÍNIO
                    </button>

                    <button
                        class="learning-btn"
                        onclick="selecionarModulo('LEITURA', this)">
                        <span class="learning-icon">📖</span>
                        LEITURA
                    </button>

                </div>

                <p id="status-label">
                    MÓDULO ATIVO: ATENÇÃO
                </p>

            </div>

            <!-- ROBÔ -->

            <div class="avatar-3d">

                <spline-viewer
                    url="genkub_greeting_robot.spline">
                </spline-viewer>

            </div>

            <h2>
                Olá, Mestre Matheus!
            </h2>

            <p class="subtitle">
                Ambiente digital para exploração,
                avaliação e desenvolvimento da aprendizagem.
            </p>

            <!-- LOGIN -->

            <input
                type="text"
                id="idInput"
                placeholder="DIGITE SEU ID"
                autocomplete="off"
            >

            <button
                class="btn-neuro"
                onclick="validarAcesso()">

                ACESSAR LABORATÓRIO

            </button>

            <!-- BIBLIOTECA -->

            <a
                href="biblioteca.html"
                class="btn-neuro btn-library">

                📚 BIBLIOTECA DIGITAL

            </a>

            <!-- ATLAS -->

            <a
                href="atlas.html"
                class="btn-atlas">

                🧩 EXPLORAR MAPA DA APRENDIZAGEM 3D

            </a>

            <!-- QR -->

            <div class="qr-section">

                <img
                    src="qr-code.png"
                    alt="QR Code">

                <p>
                    bit.ly/tcc-uninta
                </p>

            </div>

        </div>


        <!-- =========================
             CÉREBRO 3D
        ========================== -->

        <div id="brain-viewport">

            <div class="brain-label">
                SISTEMA <strong>NEURO-EDUCA</strong>
            </div>

        </div>

    </div>


    <!-- THREE.JS -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


    <script>

        /* =====================================
           CONFIGURAÇÃO THREE.JS
        ====================================== */

        const container =
            document.getElementById('brain-viewport');

        const scene =
            new THREE.Scene();

        scene.fog =
            new THREE.FogExp2(0x06101f, 0.045);


        const camera =
            new THREE.PerspectiveCamera(
                35,
                container.clientWidth /
                container.clientHeight,
                0.1,
                1000
            );

        camera.position.z = 8;


        const renderer =
            new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });

        renderer.setSize(
            container.clientWidth,
            container.clientHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        container.appendChild(
            renderer.domElement
        );


        /* =====================================
           ILUMINAÇÃO
        ====================================== */

        scene.add(
            new THREE.AmbientLight(
                0xffffff,
                0.65
            )
        );


        const pLight =
            new THREE.PointLight(
                0x8db5ff,
                1.6
            );

        pLight.position.set(
            5,
            5,
            10
        );

        scene.add(pLight);


        const secondaryLight =
            new THREE.PointLight(
                0x7c5cff,
                1
            );

        secondaryLight.position.set(
            -5,
            -2,
            5
        );

        scene.add(secondaryLight);


        /* =====================================
           PARTÍCULAS
        ====================================== */

        const partGeo =
            new THREE.BufferGeometry();

        const partCount = 1700;

        const posArr =
            new Float32Array(
                partCount * 3
            );


        for (
            let i = 0;
            i < partCount * 3;
            i++
        ) {

            posArr[i] =
                (Math.random() - 0.5) * 15;

        }


        partGeo.setAttribute(
            'position',
            new THREE.BufferAttribute(
                posArr,
                3
            )
        );


        const partMat =
            new THREE.PointsMaterial({

                size: 0.035,

                color: 0x8db5ff,

                transparent: true,

                opacity: 0.5

            });


        const particles =
            new THREE.Points(
                partGeo,
                partMat
            );


        scene.add(particles);


        /* =====================================
           CÉREBRO
        ====================================== */

        let brain = null;

        let tX = 0;

        let tY = 0;

        let moduloAtual = 'ATENÇÃO';

        let pulseSpeed = 0.002;


        const loader =
            new THREE.GLTFLoader();


        loader.load(
            './human-brain.glb',

            (gltf) => {

                brain =
                    gltf.scene;


                brain.traverse(
                    c => {

                        if (c.isMesh) {

                            c.material =
                                new THREE.MeshStandardMaterial({

                                    color: 0x101a32,

                                    emissive: 0x4f7cff,

                                    emissiveIntensity: 0.8,

                                    roughness: 0.35,

                                    metalness: 0.4

                                });

                        }

                    }
                );


                brain.scale.set(
                    1.15,
                    1.15,
                    1.15
                );


                scene.add(brain);

            },

            undefined,

            (err) => {

                console.error(
                    "Erro ao carregar cérebro:",
                    err
                );

            }
        );


        /* =====================================
           MÓDULOS PEDAGÓGICOS
        ====================================== */

        window.selecionarModulo =
            function(modulo, elemento) {

                moduloAtual =
                    modulo;


                document
                    .querySelectorAll(
                        '.learning-btn'
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            'active'
                        );

                    });


                elemento.classList.add(
                    'active'
                );


                const label =
                    document.getElementById(
                        'status-label'
                    );


                if (modulo === 'ATENÇÃO') {

                    pulseSpeed = 0.004;

                    particles.material
                        .color
                        .setHex(0x4f7cff);

                    label.innerText =
                        "MÓDULO ATIVO: ATENÇÃO";

                    label.style.color =
                        "#6f9bff";

                }


                else if (modulo === 'MEMÓRIA') {

                    pulseSpeed = 0.0015;

                    particles.material
                        .color
                        .setHex(0x7c5cff);

                    label.innerText =
                        "MÓDULO ATIVO: MEMÓRIA";

                    label.style.color =
                        "#9b86ff";

                }


                else if (modulo === 'RACIOCÍNIO') {

                    pulseSpeed = 0.003;

                    particles.material
                        .color
                        .setHex(0x00d4ff);

                    label.innerText =
                        "MÓDULO ATIVO: RACIOCÍNIO";

                    label.style.color =
                        "#00d4ff";

                }


                else if (modulo === 'LEITURA') {

                    pulseSpeed = 0.002;

                    particles.material
                        .color
                        .setHex(0x35d07f);

                    label.innerText =
                        "MÓDULO ATIVO: LEITURA";

                    label.style.color =
                        "#35d07f";

                }

            };


        /* =====================================
           ACESSO
        ====================================== */

        window.validarAcesso =
            function() {

                const val =
                    document
                        .getElementById('idInput')
                        .value
                        .toUpperCase()
                        .trim();


                if (
                    val === "MATH001" ||
                    val.startsWith("PAC")
                ) {

                    window.location.href =
                        "aluno.html";

                }

                else {

                    if (brain) {

                        brain.traverse(
                            c => {

                                if (c.isMesh) {

                                    c.material
                                        .emissive
                                        .setHex(
                                            0xff3d5a
                                        );

                                    c.material
                                        .emissiveIntensity =
                                            3;

                                }

                            }
                        );

                    }


                    const input =
                        document
                            .getElementById(
                                'idInput'
                            );


                    input.style.borderColor =
                        "#ff3d5a";


                    setTimeout(
                        () => {

                            input.style
                                .borderColor =
                                "rgba(255,255,255,.1)";


                            if (brain) {

                                brain.traverse(
                                    c => {

                                        if (c.isMesh) {

                                            c.material
                                                .emissive
                                                .setHex(
                                                    0x4f7cff
                                                );

                                            c.material
                                                .emissiveIntensity =
                                                    0.8;

                                        }

                                    }
                                );

                            }

                        },
                        700
                    );

                }

            };


        /* =====================================
           INTERAÇÃO COM MOUSE
        ====================================== */

        window.addEventListener(
            'mousemove',
            (e) => {

                tX =
                    (
                        e.clientX /
                        window.innerWidth -
                        0.5
                    ) * 0.2;


                tY =
                    (
                        e.clientY /
                        window.innerHeight -
                        0.5
                    ) * 0.2;

            }
        );


        /* =====================================
           ANIMAÇÃO
        ====================================== */

        function animate() {

            requestAnimationFrame(
                animate
            );


            particles.rotation.y +=
                moduloAtual === 'ATENÇÃO'
                    ? 0.0025
                    : 0.0008;


            particles.rotation.x +=
                0.0002;


            if (brain) {

                brain.rotation.y +=
                    0.003;


                brain.rotation.x +=
                    0.05 *
                    (
                        tY -
                        brain.rotation.x
                    );


                brain.rotation.z +=
                    0.05 *
                    (
                        tX -
                        brain.rotation.z
                    );


                const p =
                    0.65 +
                    Math.sin(
                        Date.now() *
                        pulseSpeed
                    ) *
                    0.25;


                brain.traverse(
                    c => {

                        if (c.isMesh) {

                            c.material
                                .emissiveIntensity =
                                p;


                            if (
                                moduloAtual ===
                                'ATENÇÃO'
                            ) {

                                c.material
                                    .emissive
                                    .setHex(
                                        0x4f7cff
                                    );

                            }

                            else if (
                                moduloAtual ===
                                'MEMÓRIA'
                            ) {

                                c.material
                                    .emissive
                                    .setHex(
                                        0x7c5cff
                                    );

                            }

                            else if (
                                moduloAtual ===
                                'RACIOCÍNIO'
                            ) {

                                c.material
                                    .emissive
                                    .setHex(
                                        0x00d4ff
                                    );

                            }

                            else if (
                                moduloAtual ===
                                'LEITURA'
                            ) {

                                c.material
                                    .emissive
                                    .setHex(
                                        0x35d07f
                                    );

                            }

                        }

                    }
                );

            }


            renderer.render(
                scene,
                camera
            );

        }


        animate();


        /* =====================================
           RESIZE
        ====================================== */

        window.addEventListener(
            'resize',
            () => {

                camera.aspect =
                    container.clientWidth /
                    container.clientHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    container.clientWidth,
                    container.clientHeight
                );

            }
        );

    </script>

</body>
</html>
